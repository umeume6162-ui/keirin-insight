<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07131e">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>HORSE RACING INSIGHT｜競馬研究</title>
  <meta name="description" content="競馬の研究台帳、予想、結果検証とJRA公式情報への入口。">
  <link rel="stylesheet" href="./site-ui.css">
  <script src="./horse-portal.js" defer></script>
  <style>
    [hidden] { display: none !important; }
    .horse-shell { max-width: 820px; font-size: 16px; }
    .horse-switch a { display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; }
    .horse-intro { margin-bottom: 24px; }
    .horse-intro .eyebrow { color: var(--gold); }
    .horse-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
    .horse-grid .link-card { min-height: 82px; }
    .horse-grid .link-card span { font-size: 14px; }
    .horse-settings summary { cursor: pointer; min-height: 44px; padding: 9px 0; font-weight: 700; }
    .horse-settings label { display: block; margin: 12px 0 6px; font-weight: 700; }
    .horse-settings input { width: 100%; min-height: 46px; padding: 8px 10px; border: 1px solid var(--stroke); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 16px; }
    .horse-settings .actions { margin-top: 10px; }
    #connection-status { min-height: 1.6em; font-size: 14px; }
    @media (max-width: 440px) {
      .horse-grid { grid-template-columns: 1fr; }
      .horse-grid .link-card { min-height: 64px; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">本文へ移動</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="./index.html"><span>RACE</span> INSIGHT</a>
      <nav class="main-nav horse-switch" aria-label="競技切り替え">
        <a href="./index.html">競輪</a>
        <a href="./horse.html" aria-current="page">競馬</a>
      </nav>
    </div>
  </header>
  <main id="main" class="shell horse-shell">
    <section class="horse-intro" aria-labelledby="horse-title">
      <p class="eyebrow">HORSE RACING INSIGHT</p>
      <h1 id="horse-title">競馬研究</h1>
      <a class="action-secondary" href="https://www.jra.go.jp/keiba/" rel="noreferrer">JRA公式の出馬表・結果</a>
    </section>
    <section aria-labelledby="research-title">
      <h2 id="research-title">個人研究台帳</h2>
      <p class="muted">研究メニューは Google スプレッドシートで開きます。閲覧には台帳へのアクセス権がある Google アカウントが必要です。</p>
      <nav id="research-links" class="horse-grid" aria-label="競馬研究メニュー" hidden>
        <a class="link-card" data-tab="33000001" rel="noreferrer"><strong>レースを探す</strong><span>開催日・競馬場・条件・ラップ</span></a>
        <a class="link-card" data-tab="33000002" rel="noreferrer"><strong>出走馬成績</strong><span>全頭の着順・時計・通過順</span></a>
        <a class="link-card" data-tab="11381221" rel="noreferrer"><strong>レース予想</strong><span>保存した事前予想</span></a>
        <a class="link-card" data-tab="22000001" rel="noreferrer"><strong>結果・敗因分析</strong><span>予想と着順の振り返り</span></a>
        <a class="link-card" data-tab="33000003" rel="noreferrer"><strong>コースマスター</strong><span>競馬場の諸元と公式確認状況</span></a>
        <a class="link-card" data-tab="33000009" rel="noreferrer"><strong>収録チェック</strong><span>収録件数・未確認・重複</span></a>
      </nav>
      <details id="settings" class="surface horse-settings" open>
        <summary>研究台帳のリンク設定</summary>
        <form id="sheet-form">
          <label for="sheet-link">Google スプレッドシートのURL</label>
          <input id="sheet-link" type="url" inputmode="url" autocapitalize="none" autocomplete="off" spellcheck="false" required aria-describedby="sheet-hint">
          <p id="sheet-hint" class="muted">設定はこのブラウザに保存されます。</p>
          <div class="actions">
            <button type="submit" class="action-primary">リンクを保存</button>
            <button type="button" id="remove-sheet" class="action-secondary" hidden>保存したリンクを解除</button>
          </div>
        </form>
      </details>
      <p id="connection-status" class="muted" role="status"></p>
      <noscript><p>研究台帳のリンク設定には JavaScript が必要です。</p></noscript>
    </section>
  </main>
</body>
</html>
