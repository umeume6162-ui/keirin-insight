<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081622"><title>研究用レース再構築 | KEIRIN INSIGHT</title>
<style>:root{color-scheme:dark;--bg:#081622;--panel:#112738;--mint:#9becc9;--muted:#aec6d0;--line:#345263}*{box-sizing:border-box}body{margin:0;background:#081622;color:#edf7ff;font:15px/1.6 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:850px;margin:auto;padding:18px 14px 66px}nav{display:flex;gap:8px;overflow-x:auto;padding:8px 0;white-space:nowrap}a{color:var(--mint)}nav a,.button{padding:9px 12px;border:1px solid var(--line);border-radius:8px;text-decoration:none;background:var(--panel)}.panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:15px;margin:13px 0}h1{font-size:clamp(22px,5vw,31px)}h2{font-size:18px;margin:0 0 8px}.meta{color:var(--muted);font-size:13px}.status{font-size:12px;background:#33434c;color:#fff;padding:3px 8px;border-radius:20px;display:inline-block}.group{display:flex;flex-wrap:wrap;gap:7px}.group span{background:#081622;border:1px solid var(--line);border-radius:8px;padding:5px 9px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted)}.scroll{overflow:auto}.error{color:#ffb7a8}small{color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:10px}details summary{cursor:pointer;color:var(--mint)}</style></head>
<body><main><nav aria-label="研究ナビ"><a href="./index.html">ホーム</a><a href="./research-hub.html">研究状況</a><a href="./comparison-races.html">既存比較</a><a href="./race-index-live.html">結果検索</a></nav><p class="meta">KEIRIN INSIGHT / SOURCE-FIRST RESEARCH</p><h1>ネット起点・再構築レース</h1><section class="panel"><strong>研究候補（正式公開データとは別）</strong><p>ネット上の出走表・結果・予想ラインを収集して作成した、正式PASS前の研究用候補です。結果や並びの表示があっても、2独立原資料の全必須項目合格、正式公開、AI学習への採用を意味しません。</p><small>掲載元の同一上流転載、欠車・例外着順、未掲載上がりなどは個別に保留します。</small></section><p id="summary" class="meta">研究候補を確認中…</p><div id="cards"></div><p class="meta">読み込み失敗時は候補のJSON原本をGitHubで確認してください。公開用の検証済みフィードはここでは変更しません。</p></main>
<script>
const BASE='./tools/reconstruction-candidates/';
const names=['2026-11-20_42_1','2026-11-20_42_2','2026-11-20_42_3','2026-11-20_42_4','2026-11-20_42_5','2026-11-20_42_6','2026-11-20_42_7','2026-11-20_42_8','2026-11-20_42_9','2026-11-20_22_1','2026-11-20_22_2'];
const el=document.getElementById('cards');const summary=document.getElementById('summary');
const mk=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=String(txt);return n;};
function link(text,url){const a=mk('a','',text);a.href=url;return a;}
function draw(d,id){const card=mk('section','panel'),header=mk('h2','',d.race?.date+' '+d.race?.venue+' '+d.race?.raceNo+'R '+(d.race?.class||''));card.append(header,mk('span','status','研究用・正式PASS前'));
const r=Array.isArray(d.results)?d.results:[],groups=d.preRaceFormation?.groups||[];
card.append(mk('p','meta','登録キー：'+(d.raceKey||id)+'　記録行：'+r.length+'名'));
const g=mk('div','group');for(const x of groups){g.append(mk('span','',(Array.isArray(x)?x:[]).join('－')+(x.length===1?'（単騎）':'')));}card.append(mk('h3','','発走前の予想ライン'),g);
const detail=mk('details'),label=mk('summary','','結果・未解決項目を表示');detail.append(label);const scroll=mk('div','scroll'),t=mk('table');const head=mk('tr');for(const v of ['着順','車番','選手','上がり','着差','S/B'])head.append(mk('th','',v));t.append(head);for(const x of r){const tr=mk('tr');for(const v of [x.finishRaw??x.finish??x.exceptionRaw??'—',x.car,x.name,x.lapSeconds??'未掲載',x.marginRaw||'—',x.sbRaw||'—'])tr.append(mk('td','',v));t.append(tr)}scroll.append(t);detail.append(scroll);const issues=(d.remainingToPass||[]).slice(0,5);if(issues.length){detail.append(mk('p','meta','正式PASSに残る条件：'+issues.join(' ／ ')))}card.append(detail);
const actions=mk('p','actions');actions.append(link('JSON原本',BASE+id+'.research.json'),link('照合レポート',BASE+id+'.REPORT.md'));card.append(actions);el.append(card);}
(async()=>{const res=await Promise.allSettled(names.map(async id=>{const r=await fetch(BASE+id+'.research.json',{cache:'no-store'});if(!r.ok)throw Error(r.status+' '+id);return {id,record:await r.json()};}));let n=0;for(const x of res){if(x.status==='fulfilled'){draw(x.value.record,x.value.id);n++;}else{const card=mk('p','error','取得できない研究候補があります。');el.append(card);}}summary.textContent='保存済み研究候補の表示：'+n+' / '+names.length+'件（正式PASSには加算しません）';})();
</script></body></html>
