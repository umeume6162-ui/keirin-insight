<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081622"><title>並び予想一覧 | KEIRIN INSIGHT</title><link rel="stylesheet" href="./site-ui.css"><script src="./verified-publication-guard-v138.js"></script><style>
main{max-width:880px;margin:auto;padding:17px 14px 70px}h1{font-size:30px}.forecast{background:#132a3a;border:1px solid #456475;border-radius:15px;padding:16px;margin:16px 0}.forecast h2{font-size:19px;margin:0 0 7px}.muted{font-size:13px;color:#b8cbd6}.groups{display:flex;gap:13px;flex-wrap:wrap;margin:13px 0}.group{display:flex;gap:4px;border-right:1px solid #607e8e;padding-right:12px}.group:last-child{border:0}.chip{display:inline-grid;place-items:center;border-radius:8px;width:36px;height:38px;font-size:19px;font-weight:bold}nav{display:flex;gap:12px;flex-wrap:wrap}a{color:#96efd1}#status{overflow-wrap:anywhere}</style></head><body><main>
<nav><a href="./index.html">ホーム</a><a href="./daily-board.html">出走表</a><a href="./race-index-live.html">正式結果</a></nav>
<p class="muted">KEIRIN INSIGHT / PRE-RACE FORECAST</p><h1>媒体の並び予想</h1>
<p>発走前に各媒体が掲載した<strong>予想</strong>を、元のグループ順で表示します。<strong>脚見せや実際の隊列の確定情報ではありません。</strong> 他媒体との一致も要求しません。</p>
<p id="status" role="status">公開データの確認中…</p><section id="list" aria-label="並び予想一覧"></section>
</main><script>(()=>{'use strict';const $=id=>document.getElementById(id),colors={1:['#f5f5f5','#111'],2:['#222','#fff'],3:['#d54545','#fff'],4:['#2d60bb','#fff'],5:['#f0dd55','#111'],6:['#258752','#fff'],7:['#ec9635','#111'],8:['#dfa3c6','#111'],9:['#8253ae','#fff']};
const el=(tag,t,cls)=>{const x=document.createElement(tag);if(t!==undefined)x.textContent=t;if(cls)x.className=cls;return x};
function show(r,hasResult){const box=el('article',undefined,'forecast');box.append(el('h2',r.date+' '+r.track+' '+r.race+'R'));const method=r.officialVerification?.method==='published_single_source_forecast'?'1媒体の掲載予想':'既存の発走前予想記録';box.append(el('p',method+' ／ '+(hasResult?'正式結果も掲載':'正式結果は未公開')+' ／ 記録日：'+r.verifiedDate,'muted'));const groups=el('div',undefined,'groups');for(const g of r.forecastGroups){const group=el('div',undefined,'group');for(const n of g){const chip=el('span',String(n),'chip');const [bg,fg]=colors[Number(n)];chip.style.background=bg;chip.style.color=fg;group.append(chip)}groups.append(group)}box.append(groups,el('p',r.lineMode==='no_line'?'ラインなし（個人戦）。掲載順は実走隊列ではありません。':'左端がライン先頭。1車のグループは単騎。媒体掲載の予想をそのまま表示しています。','muted'));const p=el('p',undefined,'muted'),url=r.officialVerification?.source;if(typeof url==='string'&&/^https:\/\//.test(url)){const a=el('a','掲載元を見る');a.href=url;a.target='_blank';a.rel='noopener noreferrer';p.append(a)}if(hasResult){const a=el('a','　確定結果');a.href='./race-result-detail.html?key='+encodeURIComponent(r.id);p.append(a)}box.append(p);$('list').append(box)}
async function load(){try{if(window.KIVerified?.version!=='13.8')throw Error('共通公開検査が未取得');const [a,b,i,l]=await window.KIVerified.bundle(),results=new Set(a.races.map(r=>r.key));const sorted=l.races.slice().sort((x,y)=>y.date.localeCompare(x.date)||x.track.localeCompare(y.track)||Number(x.race)-Number(y.race));sorted.forEach(r=>show(r,results.has(r.id)));$('status').textContent='出典付きの事前並び予想：'+sorted.length+'R（予想であり実走隊列ではありません）'}catch(e){$('status').textContent='表示保留：'+(e.message||String(e))}}load()})();</script></body></html>
