<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081724"><title>同一レース出走・着順比較 | KEIRIN INSIGHT</title><style>
:root{color-scheme:dark;--bg:#081724;--card:#122b3c;--line:#335668;--text:#eef8f8;--sub:#b4c9d0;--mint:#8cf0c5;--amber:#ffe1a1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#17483e 0,transparent 44%),var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}main{max-width:1100px;margin:auto;padding:20px 14px 75px}a{color:var(--mint)}nav{display:flex;gap:16px;flex-wrap:wrap;padding:10px 0 22px}h1{font-size:clamp(26px,5vw,40px);line-height:1.2;margin:0 0 12px}h2{font-size:19px;margin:12px 0}.sub{color:var(--sub);margin:0 0 20px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0}.notice{border-left:4px solid #e3ba68;background:#302f2b;padding:12px;border-radius:8px;color:#fff0d5}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}input,select,button{font:inherit;border:1px solid #638594;background:#0d2030;color:#fff;border-radius:10px;min-width:0;padding:11px}button{background:#174e4b;border-color:#4b9a83;cursor:pointer}input,select{flex:1 1 170px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 8px;border-bottom:1px solid #39566a;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#153243}.scroll{overflow:auto;max-height:75vh}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{display:block;background:#102e39;border:1px solid #345966;border-radius:12px;padding:16px;text-decoration:none}.card b{display:block;color:#f2ffff;font-size:18px;margin-bottom:7px}.card p{color:#bfd3d6;font-size:13px}.metric{display:inline-block;background:#193b47;padding:9px 13px;margin:4px;border-radius:10px}.muted{color:var(--sub)}.pill{display:inline-block;border:1px solid #557d83;border-radius:20px;padding:3px 8px;margin:2px;font-size:12px}.good{color:var(--mint)}.warn{color:var(--amber)}.empty{padding:20px;color:var(--sub)}@media(max-width:500px){main{padding:15px 11px 60px}th,td{padding:8px 5px;font-size:12px}.panel{padding:12px}}
</style></head><body><main><nav><a href="./research-pack-v11-7.html">v11.7研究パック</a><a href="./research-hub.html">研究ホーム</a><a href="./research-batch-v11-6.html">v11.6研究パック</a></nav><p class="muted">KEIRIN INSIGHT / RESEARCH v11.7</p><h1>同一レース出走・着順比較</h1><p class="sub">2名の選手が同じ収録レースに出走した履歴を比較。ライン相性・戦術的連携を示すものではありません。</p><div class="notice">⚠️ 収録済み結果の記述統計です。JRA等のデータではなく、競輪の保存済み結果を使用。公式結果の全件独立照合は未完了。映像でしか分からない展開・ヨコ・切替や将来の勝率を推定しません。</div><div class="panel" id="status" role="status">読み込み待機中</div>
<div class="panel"><h2>選手2名を指定</h2><div class="controls"><input id="one" placeholder="選手① 名前の一部"><input id="two" placeholder="選手② 名前の一部"><button id="run">収録内で比較</button></div><p class="muted">同姓同名があるため、完全一致の候補が複数になる場合は結果に併記します。</p></div><section class="panel" id="summary">検索条件を入力してください。</section><section class="panel"><div id="table" class="scroll"></div></section></main><script>
const $=id=>document.getElementById(id);const nf=n=>new Intl.NumberFormat('ja-JP').format(n);const pct=(a,b)=>b?(100*a/b).toFixed(1)+'%':'—';const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colnames=['name','prefecture','period','date','track','trackCode','race','finishRaw','number','riderClass','winningMethod','sourceUrl'];
const riderGrade=g=>g==='A3'?'A3':/^A[12]$/.test(g)?'A1/A2':(g||'未分類');
const finish=v=>/^\d+$/.test(String(v??''))&&+v>=1?+v:null;
const uniq=a=>[...new Set(a)].sort((a,b)=>String(a).localeCompare(String(b),'ja'));
const key=(d,t,r)=>[d,String(t),String(r)].join('|');
function validRow(r){return r&&r.date&&r.trackCode&&r.race}
async function loadData(){
 $('status').textContent='公開JSONを読み込み中…';
 const [a,b]=await Promise.all([fetch('./results-feed-v1.json',{cache:'no-store'}),fetch('./rider-results-feed-v1.json',{cache:'no-store'})]);
 if(!a.ok||!b.ok)throw Error('公開JSONの取得に失敗しました ('+a.status+'/'+b.status+')');
 const [results,riders]=await Promise.all([a.json(),b.json()]);
 if(results.schema!=='ki-public-results-index-v1'||riders.schema!=='ki-rider-results-v1'||!Array.isArray(results.races)||!Array.isArray(riders.rows))throw Error('JSONの形式が想定と異なります');
 const columns=riders.columns||colnames;
 const rows=riders.rows.map(arr=>Object.fromEntries(columns.map((c,i)=>[c,arr[i]])));
 const races=results.races;
 $('status').textContent='読み込み成功：'+nf(races.length)+'レース / '+nf(rows.length)+'出走行（結果データ）｜更新基準 '+escapeHTML(results.source_snapshot_date||'未記載');
 return {rows,races,results,riders};
}
function showError(e){$('status').textContent='読み込みエラー：'+e.message; $('status').className='notice';}
function optionList(id,values,label){$(id).innerHTML='<option value="">'+escapeHTML(label)+'</option>'+uniq(values.filter(Boolean)).map(v=>'<option value="'+escapeHTML(v)+'">'+escapeHTML(v)+'</option>').join('');}
function downloadCSV(name,headers,rows){const csv='\ufeff'+[headers,...rows].map(arr=>arr.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}

let DB;
function run(){const a=$('one').value.trim(),b=$('two').value.trim();if(!a||!b){$('summary').textContent='2名分の選手名を入力してください';$('table').innerHTML='';return;}const ar=DB.rows.filter(x=>x.name.includes(a)),br=DB.rows.filter(x=>x.name.includes(b));const as=uniq(ar.map(x=>x.name+'|'+x.prefecture+'|'+x.period)),bs=uniq(br.map(x=>x.name+'|'+x.prefecture+'|'+x.period));if(as.length!==1||bs.length!==1){$('summary').innerHTML='名前候補が一意でありません。① '+escapeHTML(as.join(' / ')||'該当なし')+'　② '+escapeHTML(bs.join(' / ')||'該当なし')+'。名前を詳しく入力してください。';$('table').innerHTML='';return;}const selected=(xs,id)=>xs.filter(x=>x.name+'|'+x.prefecture+'|'+x.period===id);const arows=selected(ar,as[0]),brows=selected(br,bs[0]),bm=new Map(brows.map(x=>[key(x.date,x.trackCode,x.race),x]));const common=arows.filter(x=>bm.has(key(x.date,x.trackCode,x.race))).map(x=>[x,bm.get(key(x.date,x.trackCode,x.race))]).sort((u,v)=>v[0].date.localeCompare(u[0].date));const numeric=common.filter(([x,y])=>finish(x.finishRaw)&&finish(y.finishRaw));const awin=numeric.filter(([x,y])=>finish(x.finishRaw)<finish(y.finishRaw)).length;const bwin=numeric.filter(([x,y])=>finish(x.finishRaw)>finish(y.finishRaw)).length;$('summary').innerHTML='<h2>同一レース出走：'+common.length+'件</h2><p>'+escapeHTML(as[0])+' / '+escapeHTML(bs[0])+'</p><span class="metric">両者数値着順 '+numeric.length+'</span><span class="metric">①先着 '+awin+'</span><span class="metric">②先着 '+bwin+'</span><p class="muted">収録範囲内での先着比較であり、対戦力やライン相性の予測ではありません。</p>';$('table').innerHTML=common.length?'<table><thead><tr><th>日付</th><th>競輪場/R</th><th>①車番・着順</th><th>②車番・着順</th></tr></thead><tbody>'+common.map(([x,y])=>'<tr><td>'+escapeHTML(x.date)+'</td><td>'+escapeHTML(x.track+' '+x.race+'R')+'</td><td>'+escapeHTML(x.number+'番 / '+x.finishRaw+'着')+'</td><td>'+escapeHTML(y.number+'番 / '+y.finishRaw+'着')+'</td></tr>').join('')+'</tbody></table>':'<p class="empty">同じレースでの収録出走は確認できませんでした。未収録分の出走が無いことは意味しません。</p>';}
loadData().then(d=>{DB=d;$('run').onclick=run}).catch(showError);
</script></body></html>
