<style>:root{color-scheme:dark;--bg:#081622;--panel:#122a39;--line:#395667;--mint:#a5f1d0;--muted:#bcd0db}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0%,#16443d,transparent 48%),var(--bg);color:#f4fbff;font:15px/1.55 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:790px;margin:auto;padding:15px 13px 65px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}a{color:var(--mint)}nav a{border:1px solid var(--line);background:#19394a;padding:9px 12px;border-radius:10px;text-decoration:none}h1{font-size:clamp(25px,6vw,38px)}h2{font-size:19px;margin:4px 0 13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:17px;margin:16px 0}.muted{color:var(--muted);font-size:13px}.group{display:flex;gap:4px;padding-right:12px;border-right:1px solid #617d8a}.group:last-child{border:0}.lines{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0}.chip{display:inline-grid;place-items:center;width:35px;height:38px;border-radius:8px;font-size:19px;font-weight:850}.top{font-size:clamp(36px,10vw,58px);font-weight:900;text-align:center;font-variant-numeric:tabular-nums}hr{border:0;border-top:1px solid var(--line);margin:17px 0}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:10px 4px;text-align:left}th{font-size:12px;color:var(--muted)}td:nth-child(1),td:nth-child(2){text-align:center}td:last-child,th:last-child{text-align:right}td:nth-child(3){font-weight:700}td .chip{width:28px;height:30px;font-size:16px}summary{cursor:pointer;font-weight:700}.scroll{overflow:auto}.detail{min-width:550px}#status{overflow-wrap:anywhere}a:focus-visible,summary:focus-visible{outline:2px solid var(--mint);outline-offset:3px}</style><script src="./verified-publication-guard-v138.js"></script></head><body><main><nav aria-label="サイト内移動"><a href="./index.html">ホーム</a><a href="./race-index-live.html">正式結果検索</a><a href="./comparison-races.html">研究記録</a></nav><p class="muted">KEIRIN INSIGHT / (()=>{"use strict";const $=x=>document.getElementById(x),el=(t,s,c)=>{let d=document.createElement(t);if(s!==undefined)d.textContent=String(s);if(c)d.className=c;return d},colors={1:["#f4f4f4","#161616"],2:["#242424","#fff"],3:["#d84242","#fff"],4:["#2d5fbb","#fff"],5:["#efd849","#151515"],6:["#278850","#fff"],7:["#ed9337","#181818"],8:["#dfa1c9","#151515"],9:["#8254ae","#fff"]};function chip(n){let d=el("span",n,"chip"),c=colors[Number(n)]||["#566979","#fff"];d.style.background=c[0];d.style.color=c[1];return d}const card=()=>el("section",undefined,"card"),norm=x=>String(x??"").replace(/[\s\u3000]/g,""),rank=x=>/^\d+$/.test(String(x??""))?Number(x):99;
function lineup(x,n){if(!x||!Array.isArray(x.riders)||x.riders.length!==n)return null;const groups=new Map();for(const rider of x.riders){if(!Array.isArray(rider.line)||!rider.line.length)return null;const g=rider.line.map(Number);if(!g.includes(Number(rider.number))||new Set(g).size!==g.length||g.some(v=>!Number.isInteger(v)||v<1||v>n))return null;groups.set(g.join("-"),g)}const all=[...groups.values()].flat();if(all.length!==n||new Set(all).size!==n)return null;return [...groups.values()]}
function addTable(root,head,data,detail){const wrap=detail?el("div",undefined,"scroll"):root,t=el("table",undefined,detail?"detail":""),th=el("thead"),tr=el("tr");head.forEach(v=>tr.append(el("th",v)));th.append(tr);t.append(th);const body=el("tbody");for(const row of data){const r=el("tr");row.forEach((v,i)=>{const td=el("td");if(!detail&&i===1)td.append(chip(v));else td.textContent=String(v??"—");r.append(td)});body.append(r)}t.append(body);wrap.append(t);if(detail)root.append(wrap)}
function render(r,rows,line){const root=$("content"),a=card();a.append(el("h2",r.date+" "+r.track+" "+r.race+"R"),el("p","全"+rows.length+"車の正式確認済み結果。事前の並び予想と実走中の隊列は区別しています。","muted"));root.append(a);const b=card();b.append(el("h2","事前の並び予想"));const lines=el("div",undefined,"lines");for(const g of lineup(line,rows.length)){let group=el("div",undefined,"group");g.forEach(n=>group.append(chip(n)));lines.append(group)}b.append(lines,el("p","各ラインの左端が先頭、1車組は単騎。","muted"),el("hr"),el("h2","確定上位3車"));const top=rows.filter(x=>rank(x.finishRaw)<=3).sort((a,b)=>rank(a.finishRaw)-rank(b.finishRaw)).slice(0,3);b.append(el("div",top.length===3?top.map(x=>x.number).join("－"):"未確認","top"));root.append(b);
const c=card();c.append(el("h2","全選手の結果"));const sorted=rows.slice().sort((a,b)=>rank(a.finishRaw)-rank(b.finishRaw));addTable(c,["着順","車番","選手名","上がり"],sorted.map(x=>[x.finishRaw,x.number,x.name,x.lastLapRaw||"—"]),false);const more=el("details");more.append(el("summary","決まり手・S/B・府県・期別を見る"));addTable(more,["車番","決まり手","S/B","府県","期別"],sorted.map(x=>[x.number,x.winningMethod||"—",x.startBackRaw||"—",x.prefecture,x.period]),true);c.append(more);root.append(c);const d=card();d.append(el("h2","展開の検証"),el("p","展開未検証。着順や事前ラインだけから走行経過を推測しません。","muted"));root.append(d)}
async function load(){try{if(!window.KIVerified||window.KIVerified.version!=="13.8")throw Error("掲載検査機構を確認できません");const [a,b,i,l]=await window.KIVerified.bundle();if(a.races.length===0){$("status").textContent="現在、正式公開基準を満たすレース結果はありません。研究記録とは別管理です。";return}const key=new URLSearchParams(location.search).get("key");if(!key||!/^\d{4}-\d\d-\d\d\|\d{1,3}\|\d{1,2}$/.test(key))throw Error("結果検索から対象レースを選択してください");const r=a.races.find(x=>x.key===key);if(!r)throw Error("対象レースは正式公開されていません");const ix=Object.fromEntries(b.columns.map((x,i)=>[x,i]));const rows=b.rows.map(row=>Object.fromEntries(b.columns.map((x,i)=>[x,row[i]]))).filter(x=>[x.date,String(x.trackCode),Number(x.race)].join("|")===key);const line=l.races.find(x=>x.date===r.date&&x.track===r.track&&Number(x.race)===Number(r.race));if(rows.length!==r.size||!lineup(line,r.size))throw Error("全車結果または並びの接続が未完成");const nums=new Set(rows.map(x=>Number(x.number)));if(nums.size!==r.size)throw Error("結果の車番が重複");for(const x of line.riders){const y=rows.find(z=>Number(z.number)===Number(x.number));if(!y||norm(y.name)!==norm(x.name)||norm(y.prefecture)!==norm(x.prefecture)||String(y.period)!==String(x.period))throw Error("出走選手・並びの本人照合不一致")}$("status").textContent="正式確認済み・"+r.size+"車";render(r,rows,line)}catch(e){$("status").textContent="表示保留："+(e.message||String(e))}}load();
