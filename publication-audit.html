<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081622"><title>公開データ監査 | KEIRIN INSIGHT</title><style> *{box-sizing:border-box}body{margin:0;background:#081622;color:#edf7ff;font:16px/1.65 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:760px;margin:auto;padding:18px 14px 70px}a{color:#9becc9}nav{display:flex;flex-wrap:wrap;gap:10px;padding:12px;background:#112738}nav a,button{padding:10px 14px;border:1px solid #345263;border-radius:9px;background:#112738;color:#9becc9;font:inherit}section{background:#112738;border:1px solid #345263;border-radius:14px;padding:16px;margin:14px 0}h1{font-size:26px}h2{font-size:19px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:#081622;padding:12px;border-radius:8px}.metric strong{display:block;font-size:26px;color:#9becc9}small,p.note{color:#abc0cb}#state{color:#ffd18a;overflow-wrap:anywhere}button{width:100%;cursor:pointer;margin-top:12px}</style><script src="./verified-publication-guard-v138.js"></script></head><body><nav><a href="./index.html">ホーム</a><a href="./research-hub.html">データ管理</a><a href="https://github.com/umeume6162-ui/keirin-insight/actions">実行履歴</a></nav><main><small>KEIRIN INSIGHT / v14.8</small><h1>公開データ監査</h1><section><h2>配信ファイル内の登録件数</h2><div class="grid"><div class="metric"><strong id="races">—</strong>レース</div><div class="metric"><strong id="rows">—</strong>出走記録</div><div class="metric"><strong id="ids">—</strong>選手ID</div><div class="metric"><strong id="lines">—</strong>ライン</div></div><p id="state" role="status">確認中</p><p class="note">件数は配信ファイルの構造検査結果です。独立した公式照合の合格件数ではありません。</p><button id="refresh">再確認</button><small id="time">—</small></section><section><h2>独立した公式照合監査</h2><p>状態：未確認</p><p class="note">公式照合の承認台帳および監査結果の配信接続は未完了です。この画面では監査合格を判定しません。</p><a href="https://github.com/umeume6162-ui/keirin-insight/actions">GitHub Actionsの実行履歴を確認</a></section><section><h2>掲載基準</h2><p>公式掲載値・取得日時・出典・独立承認・変更履歴が必要です。原本と正式データは区別します。</p></section></main><script>(()=>{'use strict';const $=x=>document.getElementById(x);const keys=['races','rows','ids','lines'];async function refresh(){ $('refresh').disabled=true;keys.forEach(k=>$(k).textContent='—');$('state').textContent='確認中';try{if(window.KIVerified?.version!=='13.8')throw Error('共通検査未取得');const feeds=await Promise.all(['results','rider-results','rider-ids','line-snapshots'].map(async n=>{const r=await fetch('./verified-'+n+'-feed-v1.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}));const counts=[feeds[0].races.length,feeds[1].rows.length,feeds[2].riders.length,feeds[3].races.length];keys.forEach((k,i)=>$(k).textContent=counts[i].toLocaleString('ja-JP'));$('state').textContent='配信構造の確認完了／独立照合は未確認'}catch(e){$('state').textContent='配信確認不可：'+e.message}finally{$('time').textContent='確認日時：'+new Date().toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'});$('refresh').disabled=false}}$('refresh').onclick=refresh;refresh()})();</script></body></html>
