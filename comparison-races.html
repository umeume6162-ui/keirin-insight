<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081622"><title>全着順・並び照合の研究記録 | KEIRIN INSIGHT</title>
<style>
:root{color-scheme:dark;--bg:#081622;--card:#142a39;--line:#365469;--mint:#a5f1d0;--muted:#b2c7d1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f1f8ff;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}main{max-width:900px;margin:auto;padding:16px 13px 65px}
nav{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}a{color:var(--mint)}nav a{padding:9px 12px;border:1px solid var(--line);border-radius:9px;text-decoration:none;background:var(--card)}
h1{font-size:clamp(24px,5vw,34px);line-height:1.3;margin:12px 0}h2{font-size:20px;margin:0 0 6px}
.panel{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:15px;margin:16px 0}.note{color:var(--muted);font-size:13px}
.label{border:1px solid #a88d4d;color:#ffdfa0;padding:3px 9px;border-radius:30px;font-size:12px;display:inline-block}
.formation{display:flex;gap:8px 13px;flex-wrap:wrap;margin:13px 0}.group{display:flex;gap:3px;border-right:1px solid var(--line);padding-right:10px}.group:last-child{border-right:0}
.car{min-width:32px;height:35px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;font-size:18px;font-weight:850}
.table-wrap{overflow:auto}table{width:100%;min-width:660px;border-collapse:collapse}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:#bfd6e4;font-weight:650;font-size:13px}td.num{font-variant-numeric:tabular-nums}
.sources{display:flex;flex-wrap:wrap;gap:10px;margin-top:9px}.sources a{font-size:13px;overflow-wrap:anywhere}
summary{cursor:pointer;font-weight:750;font-size:18px}details .inner{padding:9px 0}.muted{color:var(--muted)}#status{padding:9px 0}
</style></head><body><main>
<nav aria-label="サイト内移動"><a href="./index.html">ホーム</a><a href="./race-index-live.html">公式確認済み結果</a><a href="./rider-records-live.html">選手研究</a><a href="./line-scenario-lab.html">ライン研究</a><a href="./research-hub.html">データ管理</a></nav>
<p style="color:var(--mint);letter-spacing:.14em;font-weight:800">KEIRIN INSIGHT / RESEARCH</p>
<h1>全着順・並び照合の研究記録</h1>
<p class="note">全車の必要な結果項目と事前の並びについて、2サイト一致したレースだけを表示します。</p>
<p class="label">全項目・2サイト一致のみ掲載</p>
<p>このページは2サイト一致の研究照合記録です。必要項目が欠けたレースは元台帳に保留し、そろった時点で掲載します。追加の独立承認は要求しません。原本にある照合内容をそのまま閲覧可能にした研究資料です。事前の並び予想は実際の走行隊列とは異なります。</p>
<p id="status" role="status">研究用データを確認中…</p>
<div id="races"></div>
<p class="note">出典：<a href="https://docs.google.com/spreadsheets/d/1gCe5q5STYH0T8XKqxJbVawB0Cl8TPsCISFJiRUdA02M/edit#gid=2101100506">既存手動照合台帳</a>。不一致・未取得の項目は照合完了と扱いません。</p>
</main><script>
(()=>{"use strict";
const $=id=>document.getElementById(id);
const C={"1":["#f5f5f5","#141414"],"2":["#262626","#fff"],"3":["#d64343","#fff"],"4":["#2c58b9","#fff"],"5":["#f1d64c","#151515"],"6":["#2d8854","#fff"],"7":["#e79236","#161616"],"8":["#df8ac5","#151515"],"9":["#8653ad","#fff"]};
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined&&text!==null)e.textContent=String(text);if(cls)e.className=cls;return e};
function car(n){const d=el("span",n,"car");const color=C[String(n)]||["#4a6575","#fff"];d.style.background=color[0];d.style.color=color[1];return d}
function link(url,label){const a=el("a",label);a.href=url;a.target="_blank";a.rel="noopener noreferrer";return a}
function render(r){
const shell=el("section",undefined,"panel"),d=el("details");d.open=true;
const title=el("summary",r.date+" "+r.track+r.race+"R（"+r.className+"）");d.append(title);
const body=el("div",undefined,"inner");
body.append(el("p","保存済み結果：全"+r.finishers.length+"車の必要項目を2掲載元で比較済み,"note"));
body.append(el("h2","発走前の並び予想"));
if(r.formation.state==="two_site_agreement_recorded"){
const f=el("div",undefined,"formation");for(const grp of r.formation.groups){const g=el("div",undefined,"group");for(const n of grp)g.append(car(n));f.append(g)}body.append(f);
body.append(el("p","2掲載元で並び予想一致。先頭は各組左端、1車組は単騎。実走隊列ではありません。","note"));
const sites=el("div",undefined,"sources");r.formation.sources.forEach((u,i)=>sites.append(link(u,"並び出典 "+(i+1))));body.append(sites);
}else{body.append(el("p","並び：未照合。全車の過去の結果照合は保持したまま、並びだけ追加調査の対象です。","note"));}
body.append(el("h2","全車の着順・詳細"));
const wrap=el("div",undefined,"table-wrap"),table=el("table"),thead=el("thead"),head=el("tr");
["着順","車番","選手名","上がり","着差","決まり手","S/B","例外"].forEach(x=>head.append(el("th",x)));thead.append(head);table.append(thead);
const tbody=el("tbody");for(const x of r.finishers){const tr=el("tr");[x.finish,x.number,x.name,x.lastLap||"—",x.margin||"—",x.winningMethod||"—",x.startBack||"—",x.exception||"—"].forEach((v,i)=>{const td=el("td",v,i===0?"num":"");tr.append(td)});tbody.append(tr)}table.append(tbody);wrap.append(table);body.append(wrap);
const top=r.finishers.slice().sort((a,b)=>Number(a.finish)-Number(b.finish)).slice(0,3).map(x=>" "+x.number).join("–");
body.append(el("p","上位3車："+top+"（全車データは上表）"));
body.append(el("p","既存の比較記録："+r.resultComparison,"note"));
body.append(el("p","未確認・相違："+r.resultLimitations,"note"));
if(r.resultSourceUrl)body.append(link(r.resultSourceUrl,"結果の元掲載元"));
body.append(el("p","受付ID："+r.sourceReceiptId+"／受付状態："+r.sourceReceiptState,"note"));
d.append(body);shell.append(d);return shell
}
async function load(){try{const resp=await fetch("./comparison-races-v1.json",{cache:"no-store"});if(!resp.ok)throw Error("HTTP "+resp.status);const data=await resp.json();if(data.schema!=="ki-comparison-races-v1"||data.publicationPolicy!=="research-comparison-separate-from-verified"||!Array.isArray(data.races))throw Error("研究用配信形式不一致");const keys=new Set();for(const r of data.races){if(!Array.isArray(r.finishers)||!Array.isArray(r.formation.groups)||!Array.isArray(r.formation.sources)||r.finishers.length!==7&&r.finishers.length!==9||keys.has(r.key))throw Error("結果の整合性不成立");const nums=r.finishers.map(x=>Number(x.number));const formed=r.formation.groups.flat().map(Number);if(!r.resultComparison||!r.resultComparison.includes("一致"))throw Error("全車結果の二サイト比較記録が不足");if(new Set(nums).size!==nums.length)throw Error("車番重複");if(r.formation.state==="two_site_agreement_recorded"&&(formed.length!==nums.length||nums.slice().sort((a,b)=>a-b).join()!==formed.slice().sort((a,b)=>a-b).join()))throw Error("ライン・車番の不一致");if(r.formation.state!=="two_site_agreement_recorded")throw Error("未照合の並びは掲載不可");keys.add(r.key)}$("status").textContent="並び照合済み掲載："+data.races.length+"レース／全車結果："+data.races.reduce((n,r)=>n+r.finishers.length,0)+"行（公式承認済み件数とは別）";if(data.races.length===0)$("races").append(el("p","現在、全必要項目が2サイト一致したレースはありません。未合格の記録は元台帳に保持しています。","note"));for(const race of data.races)$("races").append(render(race));}catch(e){$("status").textContent="研究用データを表示できません："+e.message}}
load();
})();
</script></body></html>
