<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081622"><title>全着順・並び照合の研究記録 | KEIRIN INSIGHT</title>
<style>
:root{color-scheme:dark;--bg:#081622;--card:#142a39;--line:#365469;--mint:#a5f1d0;--muted:#b2c7d1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f1f8ff;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}main{max-width:900px;margin:auto;padding:16px 13px 65px}
nav{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}a{color:var(--mint)}nav a{padding:9px 12px;border:1px solid var(--line);border-radius:9px;text-decoration:none;background:var(--card)}
h1{font-size:clamp(24px,5vw,34px);line-height:1.3;margin:12px 0}h2{font-size:20px;margin:0 0 6px}
.panel{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:15px;margin:16px 0}.note{color:var(--muted);font-size:13px}
.label{border:1px solid #a88d4d;color:#ffdfa0;padding:3px 9px;border-radius:30px;font-size:12px;display:inline-block}
.formation{display:flex;gap:8px 13px;flex-wrap:wrap;margin:13px 0}.group{display:flex;gap:3px;border-right:1px solid var(--line);padding-right:10px}.group:last-child{border-right:0}
.car{min-width:32px;height:35px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;font-size:18px;font-weight:850}
.table-wrap{overflow:auto}table{width:100%;min-width:660px;border-collapse:collapse}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:#bfd6e4;font-weight:650;font-size:13px}td.num{font-variant-numeric:tabular-nums}
.sources{display:flex;flex-wrap:wrap;gap:10px;margin-top:9px}.sources a{font-size:13px;overflow-wrap:anywhere}
summary{cursor:pointer;font-weight:750;font-size:18px}details .inner{padding:9px 0}.muted{color:var(--muted)}#status{padding:9px 0}

/* iPhone race-result acceptance layout: no inferred weather or tactics */
.race-summary{background:#0b1d2a;border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin:12px 0;font-weight:650;overflow-wrap:anywhere}
.line-result-card{border:1px solid #4b6879;border-radius:18px;background:#102636;padding:18px 15px;margin:15px 0}
.line-result-card h2{font-size:clamp(17px,4.7vw,22px);line-height:1.4;color:#d9ebf1}
.line-result-card .formation{gap:12px 14px;margin:17px 0 16px}
.line-result-card .group{gap:4px}
.line-result-card .car{min-width:35px;height:38px;font-size:21px}
.line-result-card hr{border:0;border-top:1px solid var(--line);margin:21px 0}
.top-label{font-size:17px;font-weight:780;color:#cbdbe1}
.top-three{text-align:center;font-size:clamp(36px,9.5vw,58px);font-weight:900;letter-spacing:.04em;line-height:1.3;padding:11px 0;font-variant-numeric:tabular-nums}
.race-weather{color:#c1d8de;font-size:15px}
.race-table{width:100%;min-width:0;border-collapse:collapse}
.race-table th,.race-table td{padding:11px 5px;white-space:normal}
.race-table th:nth-child(1),.race-table td:nth-child(1){width:12%;text-align:center}
.race-table th:nth-child(2),.race-table td:nth-child(2){width:15%;text-align:center}
.race-table th:nth-child(3),.race-table td:nth-child(3){width:52%;font-weight:750}
.race-table th:nth-child(4),.race-table td:nth-child(4){width:21%;text-align:right;font-variant-numeric:tabular-nums}
.race-table .car{min-width:28px;height:30px;font-size:17px;border-radius:6px}
.race-table th{font-size:12px}
.race-table td{font-size:clamp(13px,3.7vw,17px)}
.details-title{margin-top:15px}
.detail-table{min-width:540px;font-size:13px}
.detail-table td,.detail-table th{font-size:13px}
.review-note{border-left:3px solid #78aabb;padding-left:12px;margin:14px 0}
@media(max-width:370px){.line-result-card{padding:12px 9px}.line-result-card .formation{gap:7px}.line-result-card .car{min-width:29px;height:33px;font-size:18px}.race-table th,.race-table td{padding:10px 3px}}

/* Original KI research navigation: expandable across venues, not a fixed Matsuyama shortlist */
.ki-eyebrow{color:var(--mint);font-size:12px;letter-spacing:.19em;font-weight:850}
.ki-search{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,140px);gap:10px;padding:14px;background:#0d202e;border:1px solid #477467;border-radius:15px;margin:18px 0}
.ki-search label{font-size:12px;font-weight:700;color:#c1d3de;display:flex;flex-direction:column;gap:6px}
.ki-search input,.ki-search select{min-height:44px;width:100%;border:1px solid #547a88;color:#f5fffd;background:#091925;border-radius:9px;padding:9px;font:inherit}
.ki-search input:focus-visible,.ki-search select:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.ki-search .wide{grid-column:1/-1}
.ki-stats{display:flex;gap:12px;flex-wrap:wrap;align-items:center;color:#cde0e9;font-size:13px}
.ki-stats strong{font-size:20px;color:var(--mint);font-variant-numeric:tabular-nums}
.ki-empty{background:var(--card);border-radius:12px;padding:22px;text-align:center}
@media(max-width:370px){.ki-search{grid-template-columns:1fr}}
</style></head><body><main>
<nav aria-label="サイト内移動"><a href="./index.html">ホーム</a><a href="./race-index-live.html">公式確認済み結果</a><a href="./rider-records-live.html">選手研究</a><a href="./line-scenario-lab.html">ライン研究</a><a href="./research-hub.html">データ管理</a></nav>
<p style="color:var(--mint);letter-spacing:.14em;font-weight:800">KEIRIN INSIGHT / RESEARCH</p>
<h1>全着順・並び照合の研究記録</h1>
<p class="note">既存の全車結果・事前の並びの比較記録を表示します。項目別の独立証拠が未完成のレースは正式公開済みとは扱いません。</p>
<p class="label">研究用の照合記録・正式結果とは別</p>
<p>これは研究用の比較記録です。正式公開フィードとは別であり、照合証拠の欠損は各レースに明示します。事前の並び予想は実際の走行隊列とは異なります。</p>
<section class="ki-search" aria-label="研究レースの絞り込み"><label class="wide">開催日・競輪場・R・選手名で検索<input id="raceSearch" type="search" placeholder="例：松山 5R / 2026-10-05 / 選手名" autocomplete="off"></label><label>競輪場<select id="trackFilter"><option value="">全競輪場</option></select></label><label>級班<select id="classFilter"><option value="">全級班</option></select></label><div id="filterStats" class="ki-stats wide" aria-live="polite"></div></section>
<p id="status" role="status">研究用データを確認中…</p>
<div id="races"></div>
<p class="note">照合資料と元掲載情報は管理用台帳に保存しています。未確認項目は正式公開済みとして扱いません。</p>
</main><script>
(()=>{"use strict";
const $=id=>document.getElementById(id);
const C={"1":["#f5f5f5","#141414"],"2":["#262626","#fff"],"3":["#d64343","#fff"],"4":["#2c58b9","#fff"],"5":["#f1d64c","#151515"],"6":["#2d8854","#fff"],"7":["#e79236","#161616"],"8":["#df8ac5","#151515"],"9":["#8653ad","#fff"]};
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined&&text!==null)e.textContent=String(text);if(cls)e.className=cls;return e};
function car(n){const d=el("span",n,"car");const color=C[String(n)]||["#4a6575","#fff"];d.style.background=color[0];d.style.color=color[1];return d}
function link(url,label){const a=el("a",label);a.href=url;a.target="_blank";a.rel="noopener noreferrer";return a}
function render(r){
const shell=el("section",undefined,"panel"),d=el("details");d.open=true;
const title=el("summary",r.date+" "+r.track+r.race+"R（"+r.className+"）");d.append(title);
const body=el("div",undefined,"inner");
const confirmed=(r.finishers||[]).length;
body.append(el("p","研究照合記録：全"+confirmed+"車の着順・車番・氏名・上がり・着差・決まり手・S/Bを比較。項目別独立証拠の確認は未完了のため正式公開とは別です。","race-summary"));
const card=el("section",undefined,"line-result-card");
card.append(el("h2","事前の並び予想"));
if(r.formation?.state==="two_site_agreement_recorded"){
 const groups=el("div",undefined,"formation");for(const grp of r.formation.groups){const group=el("div",undefined,"group");for(const n of grp)group.append(car(n));groups.append(group)}card.append(groups);
 card.append(el("p","各組の左端が先頭。1車組は単騎です。発走前予想であり、実走隊列ではありません。","note"));
 card.append(el("p","事前ラインの確認資料は管理用台帳に保存しています。","note"));
}else card.append(el("p","発走前の並びは未確認です。","note"));
card.append(el("hr"),el("div","確定上位3車（研究記録）","top-label"));
const ranked=r.finishers.filter(x=>/^[1-3]$/.test(String(x.finish))).sort((a,b)=>Number(a.finish)-Number(b.finish));
card.append(el("div",ranked.length===3?ranked.map(x=>x.number).join("－"):"未確認","top-three"));
const weather=[];if(r.weather)weather.push(String(r.weather));if(r.windMps!==undefined&&r.windMps!==null&&r.windMps!=="")weather.push("風速"+String(r.windMps)+"m/s");
if(weather.length)card.append(el("p",weather.join("・"),"race-weather"));
body.append(card);
body.append(el("h2","全選手の結果"));
const table=el("table",undefined,"race-table"),head=el("tr"),thead=el("thead");
["着順","車番","選手名","上がり"].forEach(x=>head.append(el("th",x)));thead.append(head);table.append(thead);
const tbody=el("tbody");for(const x of r.finishers){const tr=el("tr");tr.append(el("td",x.finish||x.exception||"—"));const n=el("td");n.append(car(x.number));tr.append(n,el("td",x.name),el("td",x.lastLap||"—"));tbody.append(tr)}table.append(tbody);body.append(table);
const more=el("details",undefined,"details-title"),mt=el("summary","着差・決まり手・S/B・府県・期別・例外を見る");
more.append(mt);const wrap=el("div",undefined,"table-wrap"),detail=el("table",undefined,"detail-table"),dh=el("tr"),dt=el("thead");
["車番","着差","決まり手","S/B","府県","期別","例外"].forEach(t=>dh.append(el("th",t)));dt.append(dh);detail.append(dt);const db=el("tbody");
for(const x of r.finishers){const tr=el("tr");[x.number,x.margin||"—",x.winningMethod||"—",x.startBack||"—",x.prefecture||"—",x.period||"—",x.exception||"—"].forEach(v=>tr.append(el("td",v)));db.append(tr)}detail.append(db);wrap.append(detail);more.append(wrap);body.append(more);
body.append(el("h2","レース展開の検証"));
if(r.raceCommentary&&r.raceCommentaryEvidence?.length){body.append(el("p",r.raceCommentary,"review-note"));body.append(el("p","展開根拠資料は管理用台帳に保存しています。","note"))}
else body.append(el("p","展開未検証。着順と事前ラインから捲り・マークなどの実走過程を推定しません。","note"));
body.append(el("p","結果の比較証拠は管理用台帳に保存しています。","note"));
body.append(el("p","正式公開用の項目別証拠は追加確認が必要です。","note"));

body.append(el("p","公開区分：研究資料（正式結果フィードには未収録）","note"));
d.append(body);shell.append(d);return shell
}

let activeRaces=[];
function addOptions(id,values){const sel=$(id);for(const name of [...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"ja"))){const option=el("option",name);option.value=name;sel.append(option)}}
function filterAndRender(){
 const term=$("raceSearch").value.trim().replace(/\\s+/g,"").toLowerCase(),track=$("trackFilter").value,grade=$("classFilter").value;
 const matches=activeRaces.filter(r=>(!track||r.track===track)&&(!grade||r.className===grade)&&(!term||[r.track,r.date,r.race+"R",r.key,r.className,...r.finishers.map(x=>x.name)].join("").replace(/\\s+/g,"").toLowerCase().includes(term)));
 $("races").replaceChildren();
 for(const r of matches)$("races").append(render(r));
 $("filterStats").textContent="研究記録 "+matches.length+" / "+activeRaces.length+" レース · "+matches.reduce((n,r)=>n+r.finishers.length,0)+"選手結果";
 if(!matches.length)$("races").append(el("p","該当する研究レースはありません。","ki-empty"));
}
async function load(){try{
 const resp=await fetch("./comparison-races-v1.json",{cache:"no-store"});
 if(!resp.ok)throw Error("HTTP "+resp.status);
 const data=await resp.json();
 if(data.schema!=="ki-comparison-races-v1"||data.publicationPolicy!=="research-comparison-separate-from-verified"||!Array.isArray(data.races))throw Error("研究用配信形式不一致");
 const keys=new Set();
 for(const r of data.races){
  if(!Array.isArray(r.finishers)||!r.formation||!Array.isArray(r.formation.groups)||!Array.isArray(r.formation.sources)||![7,9].includes(r.finishers.length)||keys.has(r.key))throw Error("研究用結果の整合性不成立");
  const nums=r.finishers.map(x=>Number(x.number)),formed=r.formation.groups.flat().map(Number);
  if(!r.resultComparison||!r.resultComparison.includes("一致"))throw Error("既存の結果比較記録が不足");
  if(new Set(nums).size!==nums.length)throw Error("車番重複");
  if(r.formation.state!=="two_site_agreement_recorded"||formed.length!==nums.length||nums.slice().sort((a,b)=>a-b).join()!==formed.slice().sort((a,b)=>a-b).join())throw Error("事前並びの車番整合が不足");
  keys.add(r.key);
 }
 activeRaces=data.races;
 addOptions("trackFilter",activeRaces.map(r=>r.track));addOptions("classFilter",activeRaces.map(r=>r.className));
 $("status").textContent="研究用の全車結果・事前並び比較記録。正式公開の合格レース数ではありません。";
 filterAndRender();
 }catch(e){$("status").textContent="研究用データを表示できません："+e.message}
}
for(const id of ["raceSearch","trackFilter","classFilter"])$(id).addEventListener(id==="raceSearch"?"input":"change",filterAndRender);

load();
})();
</script></body></html>
