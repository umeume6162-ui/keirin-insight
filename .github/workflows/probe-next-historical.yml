name: Verify next historical race candidates
on:
  push:
    paths: ['.github/workflows/probe-next-historical.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests==2.32.3' 'beautifulsoup4==4.14.2'
      - name: Observe all cars and compare to saved V99 or V98 candidate
        run: |
          python - <<'PY'
          import sys,json
          sys.path.insert(0,'scripts')
          import collect_lotoplace_result as char
          from compare_race_results import normalized_name,normalized_prefecture,canonical_method
          baselines=json.loads('''{"2026-10-04|75|11":[{"number":2,"name":"佐々木亮太","prefecture":"青森","period":"125","finish":"1","method":"逃げ","exception":""},{"number":7,"name":"福永大智","prefecture":"大阪","period":"113","finish":"2","method":"マーク","exception":""},{"number":6,"name":"金成和幸","prefecture":"福島","period":"88","finish":"3","method":"","exception":""},{"number":4,"name":"中川勝貴","prefecture":"福井","period":"109","finish":"4","method":"","exception":""},{"number":1,"name":"水谷良和","prefecture":"愛知","period":"70","finish":"5","method":"","exception":""},{"number":5,"name":"磯川勝裕","prefecture":"東京","period":"113","finish":"6","method":"","exception":""},{"number":3,"name":"内田玄希","prefecture":"東京","period":"94","finish":"7","method":"","exception":""}],"2026-10-01|22|1":[{"number":1,"name":"松本一志","prefecture":"宮崎","period":"117","finish":"1","method":"逃げ","exception":""},{"number":4,"name":"福田悠航","prefecture":"福島","period":"129","finish":"2","method":"マーク","exception":""},{"number":2,"name":"永田修一","prefecture":"熊本","period":"90","finish":"3","method":"","exception":""},{"number":3,"name":"山崎光展","prefecture":"京都","period":"93","finish":"4","method":"","exception":""},{"number":6,"name":"遠澤健二","prefecture":"神奈","period":"57","finish":"5","method":"","exception":""},{"number":5,"name":"小川辰徳","prefecture":"埼玉","period":"100","finish":"6","method":"","exception":""},{"number":7,"name":"井上典善","prefecture":"千葉","period":"66","finish":"7","method":"","exception":""}]}''')
          jobs=[
            ('2026-10-04|75|11','松山','S2','https://www.chariloto.com/keirin/results/75/2026-10-04'),
            ('2026-10-01|22|1','前橋','A3','https://www.chariloto.com/keirin/results/22/2026-10-01/'),
          ]
          for key,track,grade,url in jobs:
            date,code,r=key.split('|')
            try:
              source=char.fetch(url)
              obj=char.parse_result(source,date,code,track,int(r),grade,7,url)
              parsed={int(a['number']):a for a in obj['results']}
              diffs=[]
              for exp in baselines[key]:
                a=parsed.get(exp['number'])
                if not a:
                  diffs.append((exp['number'],'missing_car'))
                  continue
                for field,norm in (('name',normalized_name),('prefecture',normalized_prefecture),('period',str),('finish',str),('method',canonical_method),('exception',str)):
                  if norm(a.get(field,'') or '')!=norm(exp[field]):
                    diffs.append((exp['number'],field))
              print('NEXT_HISTORICAL_COMPARE',key,'PASS' if not diffs else 'HOLD','cars',len(parsed),'mismatch',len(diffs),'details',diffs[:10])
            except Exception as e:
              print('NEXT_HISTORICAL_HOLD',key,type(e).__name__,str(e)[:160])
          PY
