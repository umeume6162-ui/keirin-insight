name: Verify next historical race candidates
on:
  push:
    paths: ['.github/workflows/probe-next-historical.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests==2.32.3' 'beautifulsoup4==4.14.2'
      - name: Compare eight unpublished V99 races against real published HTML
        run: |
          python - <<'PY'
          import sys,json
          sys.path.insert(0,"scripts")
          import collect_lotoplace_result as char
          from compare_race_results import normalized_name,normalized_prefecture,canonical_method
          baselines=json.loads("{\"2026-10-07|38|4\":[{\"number\":4,\"name\":\"堀 勝政\",\"prefecture\":\"群馬\",\"period\":\"83\",\"finish\":\"1\",\"method\":\"差し\",\"exception\":\"\"},{\"number\":1,\"name\":\"田中 智也\",\"prefecture\":\"静岡\",\"period\":\"74\",\"finish\":\"2\",\"method\":\"マーク\",\"exception\":\"\"},{\"number\":5,\"name\":\"田崎 隼翔\",\"prefecture\":\"栃木\",\"period\":\"129\",\"finish\":\"3\",\"method\":\"\",\"exception\":\"\"},{\"number\":7,\"name\":\"中野 良\",\"prefecture\":\"北海\",\"period\":\"83\",\"finish\":\"4\",\"method\":\"\",\"exception\":\"\"},{\"number\":3,\"name\":\"柴田 昌樹\",\"prefecture\":\"愛知\",\"period\":\"79\",\"finish\":\"5\",\"method\":\"\",\"exception\":\"\"},{\"number\":6,\"name\":\"上野 幸星\",\"prefecture\":\"富山\",\"period\":\"127\",\"finish\":\"6\",\"method\":\"\",\"exception\":\"\"},{\"number\":2,\"name\":\"坂本 敏也\",\"prefecture\":\"北海\",\"period\":\"93\",\"finish\":\"7\",\"method\":\"\",\"exception\":\"\"}],\"2026-10-07|38|5\":[{\"number\":1,\"name\":\"鈴木 那樹\",\"prefecture\":\"静岡\",\"period\":\"129\",\"finish\":\"1\",\"method\":\"逃げ\",\"exception\":\"\"},{\"number\":4,\"name\":\"安藤 宜明\",\"prefecture\":\"神奈\",\"period\":\"74\",\"finish\":\"2\",\"method\":\"マーク\",\"exception\":\"\"},{\"number\":7,\"name\":\"肥後 公允\",\"prefecture\":\"奈良\",\"period\":\"91\",\"finish\":\"3\",\"method\":\"\",\"exception\":\"\"},{\"number\":6,\"name\":\"吉澤 賢\",\"prefecture\":\"千葉\",\"period\":\"94\",\"finish\":\"4\",\"method\":\"\",\"exception\":\"\"},{\"number\":3,\"name\":\"木本 賢二\",\"prefecture\":\"大阪\",\"period\":\"69\",\"finish\":\"5\",\"method\":\"\",\"exception\":\"\"},{\"number\":2,\"name\":\"沼川 夢久\",\"prefecture\":\"群馬\",\"period\":\"81\",\"finish\":\"6\",\"method\":\"\",\"exception\":\"\"},{\"number\":5,\"name\":\"小川 辰徳\",\"prefecture\":\"埼玉\",\"period\":\"100\",\"finish\":\"7\",\"method\":\"\",\"exception\":\"\"}],\"2026-10-07|38|6\":[{\"number\":6,\"name\":\"山本 和瑳\",\"prefecture\":\"神奈\",\"period\":\"127\",\"finish\":\"1\",\"method\":\"捲くり\",\"exception\":\"\"},{\"number\":2,\"name\":\"植草 亮介\",\"prefecture\":\"千葉\",\"period\":\"90\",\"finish\":\"2\",\"method\":\"マーク\",\"exception\":\"\"},{\"number\":7,\"name\":\"中川 繁樹\",\"prefecture\":\"京都\",\"period\":\"93\",\"finish\":\"3\",\"method\":\"\",\"exception\":\"\"},{\"number\":4,\"name\":\"亀井 久幸\",\"prefecture\":\"千葉\",\"period\":\"95\",\"finish\":\"4\",\"method\":\"\",\"exception\":\"\"},{\"number\":5,\"name\":\"須藤 直道\",\"prefecture\":\"群馬\",\"period\":\"68\",\"finish\":\"5\",\"method\":\"\",\"exception\":\"\"},{\"number\":1,\"name\":\"志水 祐彦\",\"prefecture\":\"大阪\",\"period\":\"94\",\"finish\":\"6\",\"method\":\"\",\"exception\":\"\"},{\"number\":3,\"name\":\"川田 真也\",\"prefecture\":\"埼玉\",\"period\":\"125\",\"finish\":\"7\",\"method\":\"\",\"exception\":\"\"}],\"2026-10-07|38|7\":[{\"number\":1,\"name\":\"森田 康嗣\",\"prefecture\":\"北海\",\"period\":\"89\",\"finish\":\"1\",\"method\":\"捲くり\",\"exception\":\"\"},{\"number\":5,\"name\":\"山崎 司\",\"prefecture\":\"福島\",\"period\":\"95\",\"finish\":\"2\",\"method\":\"マーク\",\"exception\":\"\"},{\"number\":3,\"name\":\"上田 隼\",\"prefecture\":\"岐阜\",\"period\":\"97\",\"finish\":\"3\",\"method\":\"\",\"exception\":\"\"},{\"number\":4,\"name\":\"手島 志誠\",\"prefecture\":\"群馬\",\"period\":\"83\",\"finish\":\"4\",\"method\":\"\",\"exception\":\"\"},{\"number\":6,\"name\":\"江端 隆司\",\"prefecture\":\"福井\",\"period\":\"103\",\"finish\":\"5\",\"method\":\"\",\"exception\":\"\"},{\"number\":7,\"name\":\"荻野 哲\",\"prefecture\":\"神奈\",\"period\":\"75\",\"finish\":\"6\",\"method\":\"\",\"exception\":\"\"},{\"number\":2,\"name\":\"坂木田雄介\",\"prefecture\":\"千葉\",\"period\":\"78\",\"finish\":\"7\",\"method\":\"\",\"exception\":\"\"}],\"2026-10-07|38|8\":[{\"number\":1,\"name\":\"鈴木 良太\",\"prefecture\":\"静岡\",\"period\":\"86\",\"finish\":\"1\",\"method\":\"差し\",\"exception\":\"\"},{\"number\":7,\"name\":\"坪内 恒\",\"prefecture\":\"千葉\",\"period\":\"123\",\"finish\":\"2\",\"method\":\"逃げ\",\"exception\":\"\"},{\"number\":4,\"name\":\"工藤 政志\",\"prefecture\":\"青森\",\"period\":\"84\",\"finish\":\"3\",\"method\":\"\",\"exception\":\"\"},{\"number\":2,\"name\":\"福田 真平\",\"prefecture\":\"愛知\",\"period\":\"113\",\"finish\":\"4\",\"method\":\"\",\"exception\":\"\"},{\"number\":6,\"name\":\"牛田樹希斗\",\"prefecture\":\"愛知\",\"period\":\"119\",\"finish\":\"5\",\"method\":\"\",\"exception\":\"\"},{\"number\":5,\"name\":\"五輪 拓巳\",\"prefecture\":\"東京\",\"period\":\"127\",\"finish\":\"6\",\"method\":\"\",\"exception\":\"\"},{\"number\":3,\"name\":\"渡邊 恭典\",\"prefecture\":\"栃木\",\"period\":\"75\",\"finish\":\"7\",\"method\":\"\",\"exception\":\"\"}],\"2026-11-01|24|5\":[{\"number\":1,\"name\":\"飯尾 主税\",\"prefecture\":\"静岡\",\"period\":\"81\",\"finish\":\"1\",\"method\":\"差し\",\"exception\":\"\"},{\"number\":2,\"name\":\"小川 将人\",\"prefecture\":\"愛知\",\"period\":\"75\",\"finish\":\"2\",\"method\":\"差し\",\"exception\":\"\"},{\"number\":4,\"name\":\"亀谷 隆一\",\"prefecture\":\"神奈\",\"period\":\"92\",\"finish\":\"3\",\"method\":\"\",\"exception\":\"\"},{\"number\":6,\"name\":\"山田 純也\",\"prefecture\":\"岐阜\",\"period\":\"99\",\"finish\":\"4\",\"method\":\"\",\"exception\":\"\"},{\"number\":3,\"name\":\"伊藤 一貴\",\"prefecture\":\"栃木\",\"period\":\"72\",\"finish\":\"5\",\"method\":\"\",\"exception\":\"\"},{\"number\":5,\"name\":\"原田 泰志\",\"prefecture\":\"新潟\",\"period\":\"91\",\"finish\":\"6\",\"method\":\"\",\"exception\":\"\"},{\"number\":7,\"name\":\"山田 和巧\",\"prefecture\":\"神奈\",\"period\":\"87\",\"finish\":\"7\",\"method\":\"\",\"exception\":\"\"}],\"2026-11-01|24|6\":[{\"number\":7,\"name\":\"落合 達彦\",\"prefecture\":\"静岡\",\"period\":\"96\",\"finish\":\"1\",\"method\":\"差し\",\"exception\":\"\"},{\"number\":3,\"name\":\"手島 志誠\",\"prefecture\":\"群馬\",\"period\":\"83\",\"finish\":\"2\",\"method\":\"差し\",\"exception\":\"\"},{\"number\":2,\"name\":\"成清謙二郎\",\"prefecture\":\"千葉\",\"period\":\"90\",\"finish\":\"3\",\"method\":\"\",\"exception\":\"\"},{\"number\":5,\"name\":\"川田 忍\",\"prefecture\":\"神奈\",\"period\":\"87\",\"finish\":\"4\",\"method\":\"\",\"exception\":\"\"},{\"number\":6,\"name\":\"大泉 英則\",\"prefecture\":\"宮城\",\"period\":\"89\",\"finish\":\"5\",\"method\":\"\",\"exception\":\"\"},{\"number\":4,\"name\":\"西谷 岳文\",\"prefecture\":\"京都\",\"period\":\"93\",\"finish\":\"6\",\"method\":\"\",\"exception\":\"\"},{\"number\":1,\"name\":\"高谷進太郎\",\"prefecture\":\"三重\",\"period\":\"85\",\"finish\":\"7\",\"method\":\"\",\"exception\":\"\"}],\"2026-11-01|24|7\":[{\"number\":5,\"name\":\"高橋 秀吉\",\"prefecture\":\"秋田\",\"period\":\"88\",\"finish\":\"1\",\"method\":\"差し\",\"exception\":\"\"},{\"number\":2,\"name\":\"中村弘之輔\",\"prefecture\":\"北海\",\"period\":\"109\",\"finish\":\"2\",\"method\":\"逃げ\",\"exception\":\"\"},{\"number\":3,\"name\":\"井手 尚治\",\"prefecture\":\"神奈\",\"period\":\"65\",\"finish\":\"3\",\"method\":\"\",\"exception\":\"\"},{\"number\":1,\"name\":\"大庭 正紀\",\"prefecture\":\"富山\",\"period\":\"70\",\"finish\":\"4\",\"method\":\"\",\"exception\":\"\"},{\"number\":6,\"name\":\"奥出健士郎\",\"prefecture\":\"福井\",\"period\":\"99\",\"finish\":\"5\",\"method\":\"\",\"exception\":\"\"},{\"number\":4,\"name\":\"鷲見 逸喜\",\"prefecture\":\"岐阜\",\"period\":\"79\",\"finish\":\"6\",\"method\":\"\",\"exception\":\"\"},{\"number\":7,\"name\":\"谷澤 優貴\",\"prefecture\":\"三重\",\"period\":\"127\",\"finish\":\"7\",\"method\":\"\",\"exception\":\"\"}]}")
          jobs=json.loads("[[\"2026-10-07|38|4\",\"静岡\",\"A3\"],[\"2026-10-07|38|5\",\"静岡\",\"A3\"],[\"2026-10-07|38|6\",\"静岡\",\"A2\"],[\"2026-10-07|38|7\",\"静岡\",\"A2\"],[\"2026-10-07|38|8\",\"静岡\",\"A1\"],[\"2026-11-01|24|5\",\"宇都宮\",\"A1\"],[\"2026-11-01|24|6\",\"宇都宮\",\"A1\"],[\"2026-11-01|24|7\",\"宇都宮\",\"A1\"]]")
          passed=0
          for key,track,grade in jobs:
              day,code,r=key.split("|")
              url=f"https://www.chariloto.com/keirin/results/{int(code)}/{day}"
              try:
                  observed=char.parse_result(char.fetch(url),day,code,track,int(r),grade,7,url)
                  seen={int(x["number"]):x for x in observed["results"]}
                  diffs=[]
                  for exp in baselines[key]:
                      real=seen.get(exp["number"])
                      if real is None:
                          diffs.append((exp["number"],"missing"));continue
                      for f,norm in (("name",normalized_name),("prefecture",normalized_prefecture),
                                     ("period",lambda v:str(v).removesuffix("期")),
                                     ("finish",str),("method",canonical_method),("exception",str)):
                          if norm(real.get(f,"") or "")!=norm(exp[f]):diffs.append((exp["number"],f))
                  if len(seen)!=7:diffs.append(("ALL","count"))
                  if not diffs:passed+=1
                  print("BATCH_HISTORICAL_COMPARE",key,"PASS" if not diffs else "HOLD","cars",len(seen),"mismatchCount",len(diffs),"fields",diffs[:10],"source",url,flush=True)
              except Exception as exc:
                  print("BATCH_HISTORICAL_HOLD",key,type(exc).__name__,str(exc)[:150],flush=True)
          print("BATCH_HISTORICAL_SUMMARY","passed",passed,"attempted",len(jobs),flush=True)
          PY
