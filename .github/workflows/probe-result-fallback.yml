name: Probe historical result fallback sources (read-only)
on:
  push:
    paths:
      - '.github/workflows/probe-result-fallback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests==2.32.3' 'beautifulsoup4==4.14.2'
      - name: Probe actual existing official and historical result pages
        run: |
          python - <<'PY'
          import sys,requests,re
          from bs4 import BeautifulSoup
          sys.path.insert(0,'scripts')
          from result_robots import require_robots_access
          sources=[
            ('VENUE_MATSUYAMA_OFFICIAL','https://www.matsuyamakeirin.jp/race-info/'),
            ('CHARILOTO_MATSUYAMA_20261005','https://www.chariloto.com/keirin/results/75/2026-10-05/'),
            ('YENJOY_MATSUYAMA_5R','https://www.yen-joy.net/kaisai/race/result/detail/202610/75/20261004/20261005/5'),
            ('NETKEIRIN_KURUME_3R','https://keirin.netkeiba.com/race/result/?race_id=202610018303'),
          ]
          for label,url in sources:
            from urllib.parse import urlsplit
            host=urlsplit(url).netloc
            try:
              require_robots_access(url,host,'KEIRIN-INSIGHT-Research/1.0')
              resp=requests.get(url,timeout=18,headers={'User-Agent':'KEIRIN-INSIGHT-Research/1.0'})
              resp.raise_for_status()
              page=BeautifulSoup(resp.content,'html.parser')
              title=page.title.get_text(' ',strip=True) if page.title else ''
              tables=page.select('table')
              candidate=[]
              for t in tables:
                text=t.get_text(' ',strip=True)
                if ('着順' in text or '着 ' in text) and ('車番' in text or '選手名' in text):
                  candidate.append(len(t.select('tr')))
              links=[a.get('href','') for a in page.select('a[href]')]
              racepdf=[x for x in links if x.lower().endswith('.pdf') and ('202610' in x or '2026/10' in x)]
              print('FALLBACK_SOURCE',label,'STATUS',resp.status_code,'TITLE',title[:120],
                'TABLES',len(tables),'RESULT_TABLE_ROWS',candidate[:8],
                'TARGET_DATE',any(d in page.get_text(' ',strip=True) for d in ('2026年10月5日','2026年10月05日','2026/10/05','2026年10月1日','2026年10月01日')),
                'TARGET_PDFS',len(racepdf))
            except Exception as exc:
              print('FALLBACK_SOURCE_HOLD',label,type(exc).__name__,str(exc)[:120])
          PY

      - name: Extract complete target race data through existing adapters
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import collect_lotoplace_result as char
          import collect_netkeirin_result as nk
          cases=[
            ('CHARILOTO_MATSUYAMA_5','char','2026-10-05','75','松山',5,'A1',7,'https://www.chariloto.com/keirin/results/75/2026-10-05/'),
            ('CHARILOTO_MATSUYAMA_8','char','2026-10-05','75','松山',8,'S2',7,'https://www.chariloto.com/keirin/results/75/2026-10-05/'),
            ('CHARILOTO_MATSUYAMA_9','char','2026-10-05','75','松山',9,'S2',7,'https://www.chariloto.com/keirin/results/75/2026-10-05/'),
            ('NETKEIRIN_KURUME_3','net','2026-10-01','83','久留米',3,'A3',7,'https://keirin.netkeiba.com/race/result/?race_id=202610018303'),
          ]
          for name,adapter,day,code,track,race,grade,cars,url in cases:
            try:
              if adapter=='char':
                obs=char.parse_result(char.fetch(url),day,code,track,race,grade,cars,url)
              else:
                obs=nk.extract(nk.fetch(url),day,code,track,race,grade,cars,url)
              rows=obs['results']
              assert len(rows)==7
              assert sorted(int(r['number']) for r in rows)==list(range(1,8))
              print('FALLBACK_PARSED',name,'TOTAL',len(rows),
                    'CARS',[(r['number'],r['finish'],r['name'],r['prefecture'],r['period'],r['method']) for r in rows])
            except Exception as e:
              print('FALLBACK_PARSE_HOLD',name,type(e).__name__,str(e)[:130])
          PY

      - name: Compare extracted seven-car results with existing V99 snapshots
        run: |
          python - <<'PY'
          import sys,json
          sys.path.insert(0,'scripts')
          import collect_lotoplace_result as char
          import collect_netkeirin_result as nk
          from compare_race_results import normalized_name,normalized_prefecture,canonical_method
          baseline=json.loads('''{"2026-10-05|75|5":[{"number":7,"name":"齊藤英伊須","prefecture":"青森","period":"125","finish":"1","method":"捲くり","exception":""},{"number":3,"name":"高橋秀吉","prefecture":"秋田","period":"88","finish":"2","method":"マーク","exception":""},{"number":2,"name":"曽我圭佑","prefecture":"熊本","period":"113","finish":"3","method":"","exception":""},{"number":4,"name":"池田浩士","prefecture":"佐賀","period":"86","finish":"4","method":"","exception":""},{"number":5,"name":"黒滝大翔","prefecture":"茨城","period":"117","finish":"5","method":"","exception":""},{"number":6,"name":"武田良太","prefecture":"愛媛","period":"88","finish":"6","method":"","exception":""},{"number":1,"name":"木村浩宣","prefecture":"香川","period":"97","finish":"7","method":"","exception":""}],"2026-10-05|75|8":[{"number":7,"name":"掛水泰範","prefecture":"高知","period":"98","finish":"1","method":"差し","exception":""},{"number":3,"name":"藤岡隆治","prefecture":"徳島","period":"98","finish":"2","method":"マーク","exception":""},{"number":2,"name":"中川勝貴","prefecture":"福井","period":"109","finish":"3","method":"","exception":""},{"number":4,"name":"佐々木翔一","prefecture":"佐賀","period":"93","finish":"4","method":"","exception":""},{"number":1,"name":"磯島成介","prefecture":"青森","period":"115","finish":"5","method":"","exception":""},{"number":5,"name":"水谷良和","prefecture":"愛知","period":"70","finish":"6","method":"","exception":""},{"number":6,"name":"佐藤大地","prefecture":"三重","period":"125","finish":"7","method":"","exception":""}],"2026-10-05|75|9":[{"number":4,"name":"宮崎大空","prefecture":"熊本","period":"115","finish":"1","method":"差し","exception":""},{"number":1,"name":"森山智徳","prefecture":"熊本","period":"98","finish":"2","method":"逃げ","exception":""},{"number":2,"name":"坂本修一","prefecture":"岡山","period":"99","finish":"3","method":"","exception":""},{"number":5,"name":"三澤優樹","prefecture":"福島","period":"127","finish":"4","method":"","exception":""},{"number":3,"name":"丸山啓一","prefecture":"静岡","period":"74","finish":"5","method":"","exception":""},{"number":7,"name":"山崎泰己","prefecture":"岡山","period":"101","finish":"6","method":"","exception":""},{"number":6,"name":"金成和幸","prefecture":"福島","period":"88","finish":"7","method":"","exception":""}],"2026-10-01|83|3":[{"number":1,"name":"久保田智之","prefecture":"福岡","period":"129","finish":"1","method":"捲くり","exception":""},{"number":4,"name":"秋山貴宏","prefecture":"佐賀","period":"89","finish":"2","method":"マーク","exception":""},{"number":3,"name":"森佑樹","prefecture":"岡山","period":"94","finish":"3","method":"","exception":""},{"number":6,"name":"小野祐作","prefecture":"岡山","period":"72","finish":"4","method":"","exception":""},{"number":7,"name":"斎藤敦","prefecture":"大阪","period":"103","finish":"5","method":"","exception":""},{"number":5,"name":"岡崎和久","prefecture":"奈良","period":"78","finish":"6","method":"","exception":""},{"number":2,"name":"樫村伸平","prefecture":"兵庫","period":"99","finish":"7","method":"","exception":""}]}''')
          for key,expected in baseline.items():
            day,code,r=key.split('|')
            race=int(r)
            track='松山' if code=='75' else '久留米'
            grade='A1' if race==5 else 'S2' if code=='75' else 'A3'
            try:
              if code=='75':
                url=f'https://www.chariloto.com/keirin/results/75/{day}/'
                actual=char.parse_result(char.fetch(url),day,code,track,race,grade,7,url)
              else:
                url='https://keirin.netkeiba.com/race/result/?race_id=202610018303'
                actual=nk.extract(nk.fetch(url),day,code,track,race,grade,7,url)
              actual={int(z['number']):z for z in actual['results']}
              diffs=[]
              for ex in expected:
                z=actual.get(ex['number'])
                if z is None:
                  diffs.append((ex['number'],'missing'));continue
                for field,normalize in (('name',normalized_name),('prefecture',normalized_prefecture),('period',str),('finish',str),('method',canonical_method),('exception',str)):
                  if normalize(z.get(field,'') or '') != normalize(ex[field]):
                    diffs.append((ex['number'],field))
              print('FALLBACK_V99_COMPARE',key,'PASS' if not diffs else 'HOLD','totalCars',len(actual),'mismatchCount',len(diffs),'details',diffs[:10])
            except Exception as e:
              print('FALLBACK_V99_HOLD',key,type(e).__name__,str(e)[:120])
          PY
