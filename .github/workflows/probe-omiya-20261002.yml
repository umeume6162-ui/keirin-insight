,"11":[{"number":1,"name":"簗田一輝","prefecture":"静岡","period":"107","finish":"1","method":"差し","exception":"","riderClass":"S1"},{"number":4,"name":"松坂洋平","prefecture":"神奈","period":"89","finish":"2","method":"マーク","exception":"","riderClass":"S1"},{"number":5,"name":"根田空史","prefecture":"千葉","period":"94","finish":"3","method":"","exception":"","riderClass":"S1"},{"number":7,"name":"櫻井祐太郎","prefecture":"宮城","period":"117","finish":"4","method":"","exception":"","riderClass":"S1"},{"number":6,"name":"中川聖大","prefecture":"福岡","period":"121","finish":"5","method":"","exception":"","riderClass":"S2"},{"number":3,"name":"岩谷拓磨","prefecture":"福岡","period":"115","finish":"6","method":"","exception":"","riderClass":"S1"},{"number":2,"name":"伊東翔貴","prefecture":"福島","period":"100","finish":"7","method":"","exception":"","riderClass":"S2"}],"12":[{"number":1,"name":"森田優弥","prefecture":"埼玉","period":"113","finish":"1","method":"捲くり","exception":"","riderClass":"S2"},{"number":7,"name":"宿口陽一","prefecture":"埼玉","period":"91","finish":"2","method":"マーク","exception":"","riderClass":"S1"},{"number":2,"name":"伊藤旭","prefecture":"熊本","period":"117","finish":"3","method":"","exception":"","riderClass":"S1"},{"number":5,"name":"上田尭弥","prefecture":"熊本","period":"113","finish":"4","method":"","exception":"","riderClass":"S2"},{"number":4,"name":"竹村勇祐","prefecture":"秋田","period":"96","finish":"5","method":"","exception":"","riderClass":"S2"},{"number":6,"name":"鈴木裕","prefecture":"千葉","period":"92","finish":"6","method":"","exception":"","riderClass":"S2"},{"number":3,"name":"格清洋介","prefecture":"静岡","period":"111","finish":"7","method":"","exception":"","riderClass":"S2"}]}''')
          day,code,track='2026-10-02','25','大宮'
          url='https://www.chariloto.com/keirin/results/25/2026-10-02/'
          try:
              html=src.fetch(url)
          except Exception as exc:
              print('OMIYA_FETCH_HOLD',type(exc).__name__,str(exc)[:120])
              raise SystemExit(0)
          for race in range(1,13):
              key=f'{day}|{code}|{race}'
              if len(base[str(race)])!=7:
                  print('OMIYA_ARCHIVE_INCOMPLETE',key,'storedRows',len(base[str(race)]))
                  # Read all seven original results to identify the actual missing riders.
                  # These observations remain HOLD until the missing V99 data is reconciled.
                  try:
                      grade='A1A2' if race<=5 else 'S'
                      ob=src.parse_result(html,day,code,track,race,grade,7,url)
                      observed={int(z['number']):z for z in ob['results']}
                      saved={int(z['number']) for z in base[str(race)]}
                      missing=[observed[k] for k in sorted(observed) if k not in saved]
                      overlap=[(z['number'],observed.get(z['number'],{}).get('name'),observed.get(z['number'],{}).get('finish'),z['finish']) for z in base[str(race)]]
                      print('OMIYA_MISSING_ORIGINAL_RIDERS',key,'count',len(missing),'riders',json.dumps(missing,ensure_ascii=False))
                      print('OMIYA_PRESERVED_OVERLAP',key,'rows',json.dumps(overlap,ensure_ascii=False))
                  except Exception as exc:
                      print('OMIYA_MISSING_SOURCE_HOLD',key,type(exc).__name__,str(exc)[:120])
                  continue
              grade='A1A2' if race<=5 else 'S'
              try:
                  ob=src.parse_result(html,day,code,track,race,grade,7,url)
                  got={int(z['number']):z for z in ob['results']}
                  mismatches=[]
                  for rider in base[str(race)]:
                      found=got.get(rider['number'])
                      if not found:
                          mismatches.append((rider['number'],'missing'));continue
                      for k,norm in (('name',normalized_name),('prefecture',normalized_prefecture),
                          ('period',str),('finish',str),('method',canonical_method),('exception',str)):
                          if norm(found.get(k,'') or '')!=norm(rider[k]):
                              mismatches.append((rider['number'],k))
                  print('OMIYA_V99_COMPARE',key,'PASS' if not mismatches else 'HOLD','cars',len(got),'mismatchCount',len(mismatches),'details',mismatches[:7])
                  if race==3 and mismatches:
                      row=got.get(1)
                      print('OMIYA_RACE3_CONFLICT',key,'observed',json.dumps(row,ensure_ascii=False),
                            'stored',json.dumps([z for z in base[str(race)] if z['number']==1],ensure_ascii=False))
                      # Normalize ONLY the proven short form 失 -> 失格. Keep the
                      # raw V99 original and the published source as separate evidence.
                      normalize_status=lambda s: {'失':'失格'}.get(str(s or ''),str(s or ''))
                      canonical_diffs=[]
                      for saved in base[str(race)]:
                          actual=got.get(saved['number'])
                          if not actual:
                              canonical_diffs.append((saved['number'],'missing'));continue
                          for field,normal in (('name',normalized_name),('prefecture',normalized_prefecture),
                               ('period',str),('finish',normalize_status),
                               ('method',canonical_method),('exception',normalize_status)):
                              if normal(actual.get(field,''))!=normal(saved[field]):
                                  canonical_diffs.append((saved['number'],field))
                      print('OMIYA_RACE3_CANONICAL',key,'PASS' if not canonical_diffs else 'HOLD',
                            'cars',len(got),'mismatchCount',len(canonical_diffs),'details',canonical_diffs)

              except Exception as exc:
                  print('OMIYA_V99_HOLD',key,type(exc).__name__,str(exc)[:120])
          PY
