name: Verified data quality tests
on:
  push:
    paths:
      - 'tools/prepare_verified_release.py'
      - 'tools/test_verified_release.py'
      - '.github/workflows/verified-quality.yml'
  pull_request:
    paths:
      - 'tools/prepare_verified_release.py'
      - 'tools/test_verified_release.py'
      - '.github/workflows/verified-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validation scripts
        run: python -m py_compile tools/prepare_verified_release.py tools/test_verified_release.py
      - name: Run isolated synthetic regression tests
        run: python -m unittest discover -s tools -p test_verified_release.py -v
