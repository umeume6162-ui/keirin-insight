name: Verified data quality tests
on:
  push:
    paths:
      - 'tools/**'
      - 'verified-*-feed-v1.json'
      - '.github/workflows/verified-quality.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'verified-*-feed-v1.json'
      - '.github/workflows/verified-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test missing-line candidate queue
        run: python tools/plan_missing_lines.py --self-test
      - name: Check full-roster prediction input guards
        run: python tools/race_card_score.py
      - name: Compile validation scripts
        run: python -m compileall -q tools
      - name: Check fallback and browser guard JavaScript syntax
        run: |
          node --check tools/check_publication_completeness.cjs
          node --check verified-publication-guard-v138.js
          node --check tools/test_fallback_publication.cjs
      - name: Test real-data fallback schema and rejection cases
        run: node tools/test_fallback_publication.cjs
      - name: Run isolated synthetic regression tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v
