name: Verified data quality tests
on:
  push:
    paths:
      - 'tools/**'
      - 'verified-*-feed-v1.json'
      - '.github/workflows/verified-quality.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'verified-*-feed-v1.json'
      - '.github/workflows/verified-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validation scripts
        run: python -m compileall -q tools
      - name: Run isolated synthetic regression tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v
