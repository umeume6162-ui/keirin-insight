name: Probe seven Sasebo archived results read-only
on:
  push:
    paths:
      - '.github/workflows/probe-sasebo-historical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests==2.32.3' 'beautifulsoup4==4.14.2'
      - name: Read one historical source and compare 49 saved rider observations
        run: |
          python - <<'PY'
          import sys,json
          sys.path.insert(0,'scripts')
          import collect_lotoplace_result as src
          from compare_race_results import normalized_name,normalized_prefecture,canonical_method
          baseline=json.loads('''{"1":[{"number":7,"name":"中島瞳","prefecture":"埼玉","period":"126","finish":"1","method":"差し","exception":""},{"number":1,"name":"渡口まりあ","prefecture":"山口","period":"114","finish":"2","method":"逃げ","exception":""},{"number":3,"name":"高橋智香","prefecture":"愛知","period":"112","finish":"3","method":"","exception":""},{"number":2,"name":"島田優里","prefecture":"長崎","period":"108","finish":"4","method":"","exception":""},{"number":6,"name":"村田奈穂","prefecture":"熊本","period":"116","finish":"5","method":"","exception":""},{"number":5,"name":"松崎光優","prefecture":"新潟","period":"130","finish":"6","method":"","exception":""},{"number":4,"name":"宮地寧々","prefecture":"岐阜","period":"110","finish":"7","method":"","exception":""}],"2":[{"number":5,"name":"北岡マリア","prefecture":"石川","period":"128","finish":"1","method":"捲くり","exception":""},{"number":7,"name":"平子結菜","prefecture":"三重","period":"126","finish":"2","method":"マーク","exception":""},{"number":4,"name":"石井貴子","prefecture":"千葉","period":"106","finish":"3","method":"","exception":""},{"number":6,"name":"中川諒子","prefecture":"熊本","period":"102","finish":"4","method":"","exception":""},{"number":2,"name":"齊藤由莉","prefecture":"神奈","period":"128","finish":"5","method":"","exception":""},{"number":3,"name":"寺本愛花","prefecture":"徳島","period":"130","finish":"6","method":"","exception":""},{"number":1,"name":"濱田芽生","prefecture":"福井","period":"126","finish":"7","method":"","exception":""}],"3":[{"number":3,"name":"島野浩司","prefecture":"愛知","period":"62","finish":"1","method":"差し","exception":""},{"number":5,"name":"森崎英登","prefecture":"愛知","period":"125","finish":"2","method":"逃げ","exception":""},{"number":7,"name":"藤野貴章","prefecture":"佐賀","period":"97","finish":"3","method":"","exception":""},{"number":1,"name":"冨尾享平","prefecture":"宮崎","period":"101","finish":"4","method":"","exception":""},{"number":6,"name":"堀僚介","prefecture":"大阪","period":"109","finish":"5","method":"","exception":""},{"number":2,"name":"馬越裕之","prefecture":"奈良","period":"127","finish":"6","method":"","exception":""},{"number":4,"name":"米嶋賢二","prefecture":"長崎","period":"77","finish":"7","method":"","exception":""}],"4":[{"number":4,"name":"小川圭二","prefecture":"徳島","period":"68","finish":"1","method":"差し","exception":""},{"number":7,"name":"眞砂英作","prefecture":"香川","period":"121","finish":"2","method":"逃げ","exception":""},{"number":3,"name":"滝山実","prefecture":"徳島","period":"84","finish":"3","method":"","exception":""},{"number":1,"name":"田中秀治","prefecture":"岐阜","period":"82","finish":"4","method":"","exception":""},{"number":5,"name":"志水祐彦","prefecture":"大阪","period":"94","finish":"5","method":"","exception":""},{"number":6,"name":"山田隼司","prefecture":"岐阜","period":"91","finish":"6","method":"","exception":""},{"number":2,"name":"谷口友真","prefecture":"大阪","period":"109","finish":"7","method":"","exception":""}],"5":[{"number":1,"name":"野口正則","prefecture":"奈良","period":"105","finish":"1","method":"差し","exception":""},{"number":5,"name":"林敬宏","prefecture":"愛知","period":"117","finish":"2","method":"逃げ","exception":""},{"number":4,"name":"山本隼人","prefecture":"大阪","period":"111","finish":"3","method":"","exception":""},{"number":6,"name":"高倉俊宏","prefecture":"福岡","period":"93","finish":"4","method":"","exception":""},{"number":7,"name":"松下綾馬","prefecture":"岡山","period":"121","finish":"5","method":"","exception":""},{"number":2,"name":"梶山裕次郎","prefecture":"福岡","period":"87","finish":"6","method":"","exception":""},{"number":3,"name":"吉本哲郎","prefecture":"広島","period":"84","finish":"7","method":"","exception":""}],"6":[{"number":7,"name":"福島栄一","prefecture":"香川","period":"93","finish":"1","method":"差し","exception":""},{"number":3,"name":"高井流星","prefecture":"岡山","period":"113","finish":"2","method":"逃げ","exception":""},{"number":5,"name":"廣川泰昭","prefecture":"愛媛","period":"90","finish":"3","method":"","exception":""},{"number":2,"name":"吉田健市","prefecture":"愛知","period":"87","finish":"4","method":"","exception":""},{"number":4,"name":"金ヶ江勇気","prefecture":"佐賀","period":"111","finish":"5","method":"","exception":""},{"number":6,"name":"下岡将也","prefecture":"三重","period":"111","finish":"6","method":"","exception":""},{"number":1,"name":"山口龍也","prefecture":"長崎","period":"111","finish":"7","method":"","exception":""}],"7":[{"number":3,"name":"長野魅切","prefecture":"愛媛","period":"127","finish":"1","method":"逃げ","exception":""},{"number":7,"name":"石丸寛之","prefecture":"岡山","period":"76","finish":"2","method":"マーク","exception":""},{"number":1,"name":"加藤寛治","prefecture":"愛知","period":"83","finish":"3","method":"","exception":""},{"number":6,"name":"坂元洋行","prefecture":"三重","period":"88","finish":"4","method":"","exception":""},{"number":2,"name":"上野恭哉","prefecture":"福岡","period":"119","finish":"5","method":"","exception":""},{"number":5,"name":"中石昌芳","prefecture":"広島","period":"81","finish":"6","method":"","exception":""},{"number":4,"name":"上吹越直樹","prefecture":"鹿児","period":"86","finish":"7","method":"","exception":""}]}''')
          day,code,track='2026-10-01','85','佐世保'
          url='https://www.chariloto.com/keirin/results/85/2026-10-01'
          try:
              html=src.fetch(url)
          except Exception as err:
              print('SASEBO_FETCH_HOLD',type(err).__name__,str(err)[:145])
              raise SystemExit(0)
          for race in range(1,8):
              key=f'{day}|{code}|{race}'
              try:
                  grade='L1' if race<3 else 'A1A2'
                  obj=src.parse_result(html,day,code,track,race,grade,7,url)
                  got={int(x['number']):x for x in obj['results']}
                  diffs=[]
                  for exp in baseline[str(race)]:
                      row=got.get(exp['number'])
                      if not row:
                          diffs.append((exp['number'],'missing_car'));continue
                      for field,norm in (('name',normalized_name),('prefecture',normalized_prefecture),('period',str),('finish',str),('method',canonical_method),('exception',str)):
                          if norm(row.get(field,'') or '')!=norm(exp[field]):
                              diffs.append((exp['number'],field))
                  print('SASEBO_V99_COMPARE',key,'PASS' if not diffs else 'HOLD','cars',len(got),'mismatchCount',len(diffs),'details',diffs[:10])
              except Exception as exc:
                  print('SASEBO_V99_HOLD',key,type(exc).__name__,str(exc)[:140])
          PY
