name: Update KEIRIN INSIGHT public JSON (manual test first)
on:
  workflow_dispatch:
    schedule:
    - cron: '25 22 * * *'
permissions:
  contents: write
concurrency:
  group: keirin-public-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail safely if read-only Sheets credential is missing
        env:
          SHEET_SECRET: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SHEET_SECRET" ]; then
            echo 'Missing GOOGLE_SERVICE_ACCOUNT_JSON. Existing JSON files will not be modified.' >&2
            exit 1
          fi
      - name: Install Google authentication client
        run: pip install 'google-auth==2.38.0' 'requests==2.32.3'
      - name: Read Google Sheets and validate two matching feeds
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build_feeds.py --root .
      - name: Publish only validated changes
        run: |
          if git diff --quiet -- results-feed-v1.json rider-results-feed-v1.json; then
            echo 'No JSON changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- results-feed-v1.json rider-results-feed-v1.json
          git commit -m 'Update validated V99 public results feeds'
          git push
