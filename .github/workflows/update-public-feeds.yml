name: Update KEIRIN INSIGHT public JSON
on:
  workflow_dispatch:
  schedule:
    # JST 10:25 and 19:25; allow morning GAS collection to finish.
    - cron: '25 1,10 * * *'
permissions:
  contents: write
concurrency:
  group: keirin-public-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail safely if read-only Sheets credential is missing
        env:
          SHEET_SECRET: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SHEET_SECRET" ]; then
            echo 'Missing GOOGLE_SERVICE_ACCOUNT_JSON. Existing JSON files will not be modified.' >&2
            exit 1
          fi
      - name: Install Google authentication client
        run: pip install 'google-auth==2.38.0' 'requests==2.32.3'
      - name: Read Google Sheets and validate result, line and rider ID feeds
        id: research
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build_feeds.py --root .
      - name: Refresh existing ledger aggregate snapshots
        id: aggregates
        if: ${{ !cancelled() && steps.research.outcome != 'skipped' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build_feeds.py --root . --status-only
      - name: Publish only independently validated changes
        if: ${{ !cancelled() && (steps.research.outcome == 'success' || steps.aggregates.outcome == 'success') }}
        env:
          RESEARCH_OK: ${{ steps.research.outcome == 'success' }}
          AGGREGATES_OK: ${{ steps.aggregates.outcome == 'success' }}
        run: |
          set -euo pipefail
          if [ "$RESEARCH_OK" = true ]; then
            git add -- results-feed-v1.json rider-results-feed-v1.json
            for file in line-snapshots-feed-v1.json rider-ids-feed-v1.json; do
              if [ -f "$file" ]; then git add -- "$file"; fi
            done
          fi
          if [ "$AGGREGATES_OK" = true ]; then
            git add -- collection-status-snapshot-v1.json ledger-status-snapshot-v1.json
          fi
          if git diff --cached --quiet; then
            echo 'No validated JSON changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update independently validated research feeds and ledger aggregates'
          git push
