name: Historical reader tests and forecast retrieval
on:
  push:
    paths:
      - 'scripts/collect_kdreams_historical.py'
      - 'scripts/read_forecast_candidates.py'
      - 'tools/plan_missing_lines.py'
      - 'scripts/collect_kdreams_result.py'
      - 'verified-results-feed-v1.json'
      - '.github/workflows/test-kdreams-historical.yml'
  pull_request:
    paths:
      - 'scripts/collect_kdreams_historical.py'
      - 'scripts/read_forecast_candidates.py'
      - 'tools/plan_missing_lines.py'
      - 'scripts/collect_kdreams_result.py'
      - 'verified-results-feed-v1.json'
      - '.github/workflows/test-kdreams-historical.yml'
  schedule:
    # 19:12 JST, before the evening review task.
    - cron: '12 10 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Candidate count (5–20)
        default: "20"
      offset:
        description: Candidate offset
        default: "0"
permissions:
  contents: read
jobs:
  daily-archive-candidates:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[plan-daily-lines]')))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Summarize reusable archived line observations
        run: python tools/plan_missing_lines.py --daily-archive-summary --limit 10 >> "$GITHUB_STEP_SUMMARY"
  historical-offline-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public HTML parser dependencies
        run: pip install 'requests==2.32.3' 'beautifulsoup4==4.14.2'
      - name: Compile historical reader
        run: python -m py_compile scripts/collect_kdreams_historical.py
      - name: Test shared daily K-Dreams source (offline)
        run: python scripts/collect_kdreams_result.py
      - name: Test URL guards and full 7-car extraction (offline)
        run: python scripts/collect_kdreams_historical.py --self-test
      - name: Test forecast retrieval helpers (offline)
        run: python scripts/read_forecast_candidates.py --self-test
      - name: Retrieve forecast source observations (read only)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[read-forecast-sources]') || contains(github.event.head_commit.message, 'Publish '))) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.title, '[read-forecast-sources]'))
        env:
          LIMIT: ${{ inputs.limit || '20' }}
          OFFSET: ${{ inputs.offset || '0' }}
        run: python scripts/read_forecast_candidates.py --limit "$LIMIT" --offset "$OFFSET"
