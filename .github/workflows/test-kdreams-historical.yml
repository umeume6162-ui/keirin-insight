name: Historical reader tests and forecast retrieval
on:
  push:
    paths:
      - 'scripts/collect_kdreams_historical.py'
      - 'scripts/read_forecast_candidates.py'
      - 'scripts/collect_kdreams_result.py'
      - '.github/workflows/test-kdreams-historical.yml'
  pull_request:
    paths:
      - 'scripts/collect_kdreams_historical.py'
      - 'scripts/read_forecast_candidates.py'
      - 'scripts/collect_kdreams_result.py'
      - '.github/workflows/test-kdreams-historical.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: Candidate count (5–20)
        default: "20"
      offset:
        description: Candidate offset
        default: "0"
permissions:
  contents: read
jobs:
  historical-offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public HTML parser dependencies
        run: pip install 'requests==2.32.3' 'beautifulsoup4==4.14.2'
      - name: Compile historical reader
        run: python -m py_compile scripts/collect_kdreams_historical.py
      - name: Test shared daily K-Dreams source (offline)
        run: python scripts/collect_kdreams_result.py
      - name: Test URL guards and full 7-car extraction (offline)
        run: python scripts/collect_kdreams_historical.py --self-test
      - name: Test forecast retrieval helpers (offline)
        run: python scripts/read_forecast_candidates.py --self-test
      - name: Retrieve forecast source observations (read only)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[read-forecast-sources]'))
        env:
          LIMIT: ${{ inputs.limit || '20' }}
          OFFSET: ${{ inputs.offset || '0' }}
        run: python scripts/read_forecast_candidates.py --limit "$LIMIT" --offset "$OFFSET"
