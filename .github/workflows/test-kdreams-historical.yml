name: Test historical K-Dreams reader
on:
  push:
    paths:
      - 'scripts/collect_kdreams_historical.py'
      - '.github/workflows/test-kdreams-historical.yml'
  pull_request:
    paths:
      - 'scripts/collect_kdreams_historical.py'
      - '.github/workflows/test-kdreams-historical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public HTML parser dependencies
        run: pip install 'requests==2.32.3' 'beautifulsoup4==4.14.2'
      - name: Compile isolated historical reader
        run: python -m py_compile scripts/collect_kdreams_historical.py
      - name: Test URL guards and full 7-car extraction (offline only)
        run: python scripts/collect_kdreams_historical.py --self-test
      - name: Read-only one-race live K-Dreams probe (not an acceptance gate)
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from collect_kdreams_historical import validate_historical_url, parse_historical_html
          import collect_kdreams_result as source
          url='https://keirin.kdreams.jp/tamano/racedetail/6120261123010001/?pageType=showResult'
          validate_historical_url(url,'2026-11-23','61','玉野',1)
          try:
              html=source.fetch(url)  # robots check, one public page, no evasion
              result=parse_historical_html(html,url=url,day='2026-11-23',code='61',track='玉野',race=1,grade='L1',cars=7)
          except Exception as exc:
              print('LIVE_PROBE_HOLD',type(exc).__name__,str(exc)[:120])
              raise SystemExit(1)
          print('LIVE_PROBE_OBSERVED',len(result['observation']['results']),
                result['verificationState'])
          PY
      - name: Inspect next three pending historical races read-only
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys,json
          sys.path.insert(0,'scripts')
          from collect_kdreams_historical import parse_historical_html,validate_historical_url
          import collect_kdreams_result as source
          from compare_race_results import normalized_name,normalized_prefecture,canonical_method
          cases=json.loads('''[["2026-10-05","75","松山",5,"A1A2",7,"https://keirin.kdreams.jp/matsuyama/racedetail/7520261004020005/?pageType=KS_RACE_CARD_PAGE_TYPE_SHOW_RESULT"],["2026-10-05","75","松山",8,"S",7,"https://keirin.kdreams.jp/matsuyama/racedetail/7520261004020008/?pageType=KS_RACE_CARD_PAGE_TYPE_SHOW_RESULT"],["2026-10-05","75","松山",9,"S",7,"https://keirin.kdreams.jp/matsuyama/racedetail/7520261004020009/?pageType=KS_RACE_CARD_PAGE_TYPE_SHOW_RESULT"]]''')
          baseline=json.loads('''{"2026-10-05|75|5":[{"number":7,"name":"齊藤英伊須","prefecture":"青森","period":"125","finish":"1","method":"捲くり","exception":""},{"number":3,"name":"高橋秀吉","prefecture":"秋田","period":"88","finish":"2","method":"マーク","exception":""},{"number":2,"name":"曽我圭佑","prefecture":"熊本","period":"113","finish":"3","method":"","exception":""},{"number":4,"name":"池田浩士","prefecture":"佐賀","period":"86","finish":"4","method":"","exception":""},{"number":5,"name":"黒滝大翔","prefecture":"茨城","period":"117","finish":"5","method":"","exception":""},{"number":6,"name":"武田良太","prefecture":"愛媛","period":"88","finish":"6","method":"","exception":""},{"number":1,"name":"木村浩宣","prefecture":"香川","period":"97","finish":"7","method":"","exception":""}],"2026-10-05|75|8":[{"number":7,"name":"掛水泰範","prefecture":"高知","period":"98","finish":"1","method":"差し","exception":""},{"number":3,"name":"藤岡隆治","prefecture":"徳島","period":"98","finish":"2","method":"マーク","exception":""},{"number":2,"name":"中川勝貴","prefecture":"福井","period":"109","finish":"3","method":"","exception":""},{"number":4,"name":"佐々木翔一","prefecture":"佐賀","period":"93","finish":"4","method":"","exception":""},{"number":1,"name":"磯島成介","prefecture":"青森","period":"115","finish":"5","method":"","exception":""},{"number":5,"name":"水谷良和","prefecture":"愛知","period":"70","finish":"6","method":"","exception":""},{"number":6,"name":"佐藤大地","prefecture":"三重","period":"125","finish":"7","method":"","exception":""}],"2026-10-05|75|9":[{"number":4,"name":"宮崎大空","prefecture":"熊本","period":"115","finish":"1","method":"差し","exception":""},{"number":1,"name":"森山智徳","prefecture":"熊本","period":"98","finish":"2","method":"逃げ","exception":""},{"number":2,"name":"坂本修一","prefecture":"岡山","period":"99","finish":"3","method":"","exception":""},{"number":5,"name":"三澤優樹","prefecture":"福島","period":"127","finish":"4","method":"","exception":""},{"number":3,"name":"丸山啓一","prefecture":"静岡","period":"74","finish":"5","method":"","exception":""},{"number":7,"name":"山崎泰己","prefecture":"岡山","period":"101","finish":"6","method":"","exception":""},{"number":6,"name":"金成和幸","prefecture":"福島","period":"88","finish":"7","method":"","exception":""}]}''')
          for day,code,track,race,grade,cars,url in cases:
              key=f'{day}|{code}|{race}'
              try:
                  validate_historical_url(url,day,code,track,race)
                  html=source.fetch(url)
                  obs=parse_historical_html(html,url=url,day=day,code=code,track=track,
                                            race=race,grade=grade,cars=cars)
                  observed={int(x['number']):x for x in obs['observation']['results']}
                  diffs=[]
                  for row in baseline[key]:
                      actual=observed.get(row['number'])
                      if actual is None:
                          diffs.append((row['number'],'missing'));continue
                      for field,normalizer in (
                          ('name',normalized_name),
                          ('prefecture',normalized_prefecture),
                          ('period',str),
                          ('finish',str),
                          ('method',canonical_method),
                          ('exception',str),
                      ):
                          if normalizer(actual.get(field,'') or '')!=normalizer(row[field]):
                              diffs.append((row['number'],field))
                  print('HISTORICAL_KDREAMS_OBSERVED',key,len(observed))
                  print('HISTORICAL_V99_COMPARE',key,
                        'PASS' if not diffs else 'HOLD',
                        'mismatchCount',len(diffs),'details',diffs[:10])
              except Exception as exc:
                  print('HISTORICAL_KDREAMS_HOLD',key,type(exc).__name__,str(exc)[:120])
          PY
