name: Test historical K-Dreams reader
on:
  push:
    paths:
      - 'scripts/collect_kdreams_historical.py'
      - '.github/workflows/test-kdreams-historical.yml'
  pull_request:
    paths:
      - 'scripts/collect_kdreams_historical.py'
      - '.github/workflows/test-kdreams-historical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public HTML parser dependencies
        run: pip install 'requests==2.32.3' 'beautifulsoup4==4.14.2'
      - name: Compile isolated historical reader
        run: python -m py_compile scripts/collect_kdreams_historical.py
      - name: Test URL guards and full 7-car extraction (offline only)
        run: python scripts/collect_kdreams_historical.py --self-test
      - name: Read-only one-race live K-Dreams probe (not an acceptance gate)
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from collect_kdreams_historical import validate_historical_url, parse_historical_html
          import collect_kdreams_result as source
          url='https://keirin.kdreams.jp/tamano/racedetail/6120261123010001/?pageType=showResult'
          validate_historical_url(url,'2026-11-23','61','玉野',1)
          try:
              html=source.fetch(url)  # robots check, one public page, no evasion
              result=parse_historical_html(html,url=url,day='2026-11-23',code='61',track='玉野',race=1,grade='L1',cars=7)
          except Exception as exc:
              print('LIVE_PROBE_HOLD',type(exc).__name__,str(exc)[:120])
              raise SystemExit(1)
          print('LIVE_PROBE_OBSERVED',len(result['observation']['results']),
                result['verificationState'])
          PY
      - name: Inspect three pending historical races read-only
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from collect_kdreams_historical import validate_historical_url,parse_historical_html
          import collect_kdreams_result as source
          cases=[
              ('2026-10-05','75','松山',3,'A1A2',7,'https://keirin.kdreams.jp/matsuyama/racedetail/7520261004020003/?pageType=KS_RACE_CARD_PAGE_TYPE_SHOW_RESULT'),
              ('2026-10-05','75','松山',4,'A1A2',7,'https://keirin.kdreams.jp/matsuyama/racedetail/7520261004020004/?pageType=KS_RACE_CARD_PAGE_TYPE_SHOW_RESULT'),
              ('2026-10-05','75','松山',6,'S',7,'https://keirin.kdreams.jp/matsuyama/racedetail/7520261004020006/?pageType=KS_RACE_CARD_PAGE_TYPE_SHOW_RESULT'),
          ]
          for day,code,track,race,grade,cars,url in cases:
              key=f'{day}|{code}|{race}'
              try:
                  validate_historical_url(url,day,code,track,race)
                  html=source.fetch(url)
                  obs=parse_historical_html(html,url=url,day=day,code=code,track=track,
                                            race=race,grade=grade,cars=cars)
                  print('HISTORICAL_KDREAMS_OBSERVED',key,len(obs['observation']['results']))
                  from compare_race_results import normalized_name,normalized_prefecture,canonical_method
                  import json
                  baseline=json.loads('''{"2026-10-05|75|3":[{"number":3,"name":"滝本泰行","prefecture":"岡山","period":"107","finish":"1","method":"差し","exception":""},{"number":4,"name":"野中祐志","prefecture":"埼玉","period":"98","finish":"2","method":"差し","exception":""},{"number":7,"name":"吉田航","prefecture":"大分","period":"127","finish":"3","method":"","exception":""},{"number":1,"name":"小原唯志","prefecture":"茨城","period":"101","finish":"4","method":"","exception":""},{"number":2,"name":"内山慧大","prefecture":"福井","period":"123","finish":"5","method":"","exception":""},{"number":5,"name":"水谷将司","prefecture":"愛知","period":"105","finish":"6","method":"","exception":""},{"number":6,"name":"田中勝仁","prefecture":"千葉","period":"93","finish":"7","method":"","exception":""}],"2026-10-05|75|4":[{"number":6,"name":"三好陽一","prefecture":"愛媛","period":"88","finish":"1","method":"差し","exception":""},{"number":1,"name":"田中和磨","prefecture":"岡山","period":"113","finish":"2","method":"差し","exception":""},{"number":3,"name":"石田拓真","prefecture":"愛知","period":"119","finish":"3","method":"","exception":""},{"number":5,"name":"小林信晴","prefecture":"愛知","period":"83","finish":"4","method":"","exception":""},{"number":4,"name":"岡本英之","prefecture":"千葉","period":"85","finish":"5","method":"","exception":""},{"number":7,"name":"須賀和彦","prefecture":"茨城","period":"89","finish":"6","method":"","exception":""},{"number":2,"name":"吉竹尚城","prefecture":"静岡","period":"109","finish":"7","method":"","exception":""}],"2026-10-05|75|6":[{"number":2,"name":"磯川勝裕","prefecture":"東京","period":"113","finish":"1","method":"捲くり","exception":""},{"number":7,"name":"大矢将大","prefecture":"埼玉","period":"81","finish":"2","method":"マーク","exception":""},{"number":3,"name":"花田将司","prefecture":"千葉","period":"99","finish":"3","method":"","exception":""},{"number":5,"name":"城幸弘","prefecture":"山梨","period":"96","finish":"4","method":"","exception":""},{"number":6,"name":"栗本尚宗","prefecture":"千葉","period":"113","finish":"5","method":"","exception":""},{"number":1,"name":"竹澤浩司","prefecture":"富山","period":"90","finish":"6","method":"","exception":""},{"number":4,"name":"上杉嘉槻","prefecture":"福井","period":"119","finish":"7","method":"","exception":""}]}''')[key]
                  a={int(x['number']):x for x in obs['observation']['results']}
                  diffs=[]
                  for rider in baseline:
                      actual=a.get(rider['number'])
                      if actual is None:
                          diffs.append((rider['number'],'missing'))
                          continue
                      checks=(('name',normalized_name),('prefecture',normalized_prefecture),
                              ('period',str),('finish',str),('method',canonical_method))
                      for field,normal in checks:
                          if normal(actual.get(field,'')) != normal(rider[field]):
                              diffs.append((rider['number'],field))
                  print('HISTORICAL_V99_COMPARE',key,'PASS' if not diffs else 'HOLD',
                        'mismatchCount',len(diffs),'details',diffs[:8])
              except Exception as exc:
                  print('HISTORICAL_KDREAMS_HOLD',key,type(exc).__name__,str(exc)[:120])
                  if 'html' in locals() and 'Race date/venue not found' in str(exc):
                      from bs4 import BeautifulSoup
                      page=BeautifulSoup(html,'html.parser')
                      print('KD_TITLE_DIAGNOSTIC',key,
                            (page.title.get_text(' ',strip=True) if page.title else 'NO_TITLE')[:150],
                            'H1',[(x.get_text(' ',strip=True))[:60] for x in page.select('h1')[:2]])
                  html=None
          PY
