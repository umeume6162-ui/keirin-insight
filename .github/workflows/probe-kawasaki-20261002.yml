          try:
            html=source.fetch(url)
          except Exception as exc:
            print('KAWASAKI_SOURCE_HOLD',type(exc).__name__,str(exc)[:150])
            raise SystemExit(0)
          for key,expected in baseline.items():
            race=int(key)
            try:
              ob=source.parse_result(html,date,code,track,race,'A1A2' if race<=5 else 'S',7,url)
              got={int(r['number']):r for r in ob['results']}
              diffs=[]
              for ex in expected:
                actual=got.get(ex['number'])
                if actual is None:
                  diffs.append([ex['number'],'missing']);continue
                for fld,norm in [('name',normalized_name),('prefecture',normalized_prefecture),('period',str),('finish',str),('method',canonical_method),('exception',str)]:
                  if norm(actual.get(fld,'') or '')!=norm(ex[fld]):
                    diffs.append([ex['number'],fld,actual.get(fld,''),ex[fld]])
              print('KAWASAKI_COMPARE',f'{date}|{code}|{race}','PASS' if not diffs else 'HOLD','cars',len(got),'mismatchCount',len(diffs),'details',json.dumps(diffs[:10],ensure_ascii=False))
            except Exception as exc:
              print('KAWASAKI_HOLD',race,type(exc).__name__,str(exc)[:140])
          PY
