name: Update daily race board
on:
  push:
    paths:
      - 'scripts/discover_tospo_races.py'
      - 'scripts/auto_daily_tospo_intake.py'
      - 'scripts/auto_daily_results.py'
      - 'scripts/upsert_daily_sheets.py'
      - 'scripts/build_daily_board.py'
      - 'scripts/enrich_daily_rider_stats.py'
      - 'scripts/enrich_daily_start_times.py'
      - '.github/workflows/update-daily-board.yml'
      - 'scripts/compare_race_results.py'
      - 'scripts/collect_netkeirin_result.py'
      - 'scripts/collect_lotoplace_result.py'
      - 'scripts/collect_historical_pair.py'
      - 'scripts/collect_historical_batch.py'
      - 'scripts/result_hold_diagnostics.py'
      - 'scripts/classify_historical_candidates.py'
      - 'scripts/audit_v99_race_shape.py'
  pull_request:
    paths:
      - 'index.html'
      - 'daily-board.html'
      - 'scripts/test_daily_board_ui.js'
      - 'site-ui.css'
      - 'scripts/collect_chariloto_entry.py'
      - 'scripts/probe_daily_source.py'
      - 'scripts/collect_tospo_entry.py'
      - 'scripts/discover_tospo_races.py'
      - 'scripts/auto_daily_tospo_intake.py'
      - 'scripts/auto_daily_results.py'
      - 'scripts/enrich_daily_rider_stats.py'
      - 'scripts/enrich_daily_start_times.py'
      - 'scripts/compare_race_results.py'
      - 'scripts/collect_netkeirin_result.py'
      - 'scripts/collect_lotoplace_result.py'
      - 'scripts/collect_historical_pair.py'
      - 'scripts/collect_historical_batch.py'
      - 'scripts/result_hold_diagnostics.py'
      - 'scripts/classify_historical_candidates.py'
      - 'scripts/audit_v99_race_shape.py'
      - 'scripts/upsert_daily_sheets.py'
      - 'scripts/build_daily_board.py'
      - '.github/workflows/update-daily-board.yml'
  workflow_dispatch:
    inputs:
      race_date:
        description: 'Race date YYYY-MM-DD (manual one-race intake only)'
        required: false
        type: string
      track_code:
        description: 'Track code, e.g. 26'
        required: false
        type: string
      track_name:
        description: 'Japanese track name, e.g. 西武園'
        required: false
        type: string
      race_number:
        description: 'Race number, 1-12'
        required: false
        type: string
      source_url:
        description: 'Optional individual racecard URL; leave blank to discover venue racecards'
        required: false
        type: string
      historical_batch_plan:
        description: 'Optional JSON worklist of 1-10 historical races, read-only'
        required: false
        type: string
      historical_result_url:
        description: 'Optional netkeirin historical result page (read-only)'
        required: false
        type: string
      historical_second_url:
        description: 'Optional Chariloto or LotoPlace event-day results URL'
        required: false
        type: string
      historical_class:
        description: 'Class for historical race, e.g. A3'
        required: false
        type: string
      historical_cars:
        description: 'Expected historical cars: 7 or 9'
        required: false
        type: string
      verify_writer:
        description: 'Verify writer access without changing race rows'
        required: false
        default: false
        type: boolean
      apply_intake:
        description: 'Write validated racecard to daily entry tab (requires Sheets editor permission)'
        required: false
        default: false
        type: boolean
  schedule:
    # Explicit [refresh-daily-feed] main push rebuilds only the daily viewer feed from Sheets.
    # One-time daily viewer refresh after first verified two-site content-matched result intake.
    # UTC corresponds to JST 07:10, 12:10, 17:10, 22:10.
    - cron: '10 22,3,8,13 * * *'
    # A dedicated overnight opportunity after late midnight races (JST 00:10).
    # Existing full-field, two-publication and source-identity guards still apply.
    - cron: '10 15 * * *'
permissions:
  contents: write
concurrency:
  group: keirin-daily-board
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check read-only Sheets credential
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.historical_result_url == '' && inputs.historical_batch_plan == '') || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[verify-sheets-writer]') || contains(github.event.head_commit.message, '[refresh-daily-feed]')))
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing GOOGLE_SERVICE_ACCOUNT_JSON. Daily feed unchanged."
            exit 1
          fi
      - name: Install Google reader
        run: pip install 'google-auth==2.38.0' 'requests==2.32.3' 'beautifulsoup4==4.14.2'
      - name: Check mobile home and daily-board contracts
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          class Inspect(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts=[]
                  self.inside=False
                  self.current=''
                  self.ids=set()
                  self.links=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  if 'id' in attrs:
                      if attrs['id'] in self.ids:
                          raise ValueError('duplicate id '+attrs['id'])
                      self.ids.add(attrs['id'])
                  if tag=='a' and 'href' in attrs:
                      self.links.append(attrs['href'])
                  if tag=='script' and 'src' not in attrs:
                      self.inside=True
                      self.current=''
              def handle_data(self, data):
                  if self.inside:self.current+=data
              def handle_endtag(self,tag):
                  if tag=='script' and self.inside:
                      self.scripts.append(self.current)
                      self.inside=False
          expected={'index.html':{'races','rows','ids','lines','status','last','refresh'},
                    'daily-board.html':{'day','track','refresh','state','source','races','race-count','entry-count','result-count'}}
          for name,required in expected.items():
              content=Path(name).read_text(encoding='utf-8')
              check=Inspect()
              check.feed(content)
              assert required<=check.ids,(name,required-check.ids)
              assert './site-ui.css' in content
              assert all(Path(href.split('?')[0]).is_file() for href in check.links if href.startswith('./') and not href.startswith('./#')),name
              for i,code in enumerate(check.scripts):
                  destination=Path('/tmp')/(name.replace('.html','')+'-'+str(i)+'.js')
                  destination.write_text(code,encoding='utf-8')
                  subprocess.run(['node','--check',str(destination)],check=True)
              print('SITE_MOBILE_CONTRACT_OK',name,len(check.scripts),len(check.links))
          assert 'daily-board-feed-v1.json' in Path('daily-board.html').read_text()
          assert 'verified-publication-guard-v138.js' in Path('index.html').read_text()
          print('PUBLISHING_GUARD_AND_DAILY_FEED_REFERENCE_OK')
          PY
      - name: Check source-grounded line grouping and result rankings
        run: node scripts/test_daily_board_ui.js
      - name: Check daily intake script syntax
        run: |
          python -m py_compile scripts/build_feeds.py scripts/build_daily_board.py scripts/upsert_daily_sheets.py scripts/collect_chariloto_entry.py scripts/probe_daily_source.py scripts/collect_tospo_entry.py scripts/discover_tospo_races.py scripts/compare_race_results.py scripts/collect_netkeirin_result.py scripts/collect_lotoplace_result.py scripts/collect_historical_pair.py scripts/collect_historical_batch.py scripts/classify_historical_candidates.py scripts/auto_daily_tospo_intake.py scripts/auto_daily_results.py scripts/result_hold_diagnostics.py scripts/enrich_daily_start_times.py scripts/enrich_daily_rider_stats.py
          python scripts/collect_chariloto_entry.py --self-test
          python scripts/collect_tospo_entry.py --self-test
          python scripts/discover_tospo_races.py --self-test
          python scripts/auto_daily_tospo_intake.py --self-test
          python scripts/auto_daily_results.py --self-test
          python scripts/result_hold_diagnostics.py
          python scripts/enrich_daily_start_times.py --self-test
          python scripts/enrich_daily_rider_stats.py --self-test
          python scripts/compare_race_results.py --self-test
          python scripts/collect_netkeirin_result.py --self-test
          python scripts/collect_lotoplace_result.py --self-test
          python scripts/collect_historical_pair.py --self-test
          python scripts/collect_historical_batch.py --self-test
          python scripts/classify_historical_candidates.py --self-test
          python scripts/audit_v99_race_shape.py --self-test
          python scripts/build_daily_board.py --self-test
      - name: Validate manually supplied racecard fields
        if: github.event_name == 'workflow_dispatch' && inputs.historical_result_url == '' && inputs.historical_batch_plan == '' && inputs.source_url != ''
        env:
          RACE_DATE: ${{ inputs.race_date }}
          TRACK_CODE: ${{ inputs.track_code }}
          TRACK_NAME: ${{ inputs.track_name }}
          RACE_NUMBER: ${{ inputs.race_number }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          python - <<'PY'
          import os, re, sys
          from datetime import date
          values = [os.environ[x] for x in ('RACE_DATE','TRACK_CODE','TRACK_NAME','RACE_NUMBER','SOURCE_URL')]
          d, code, track, race, url = values
          try:
              date.fromisoformat(d)
              assert re.fullmatch(r'20\d{2}-\d{2}-\d{2}', d)
              assert code.isdigit() and 1 <= int(code) <= 99
              assert track.strip()
              assert race.isdigit() and 1 <= int(race) <= 12
              assert re.fullmatch(r'https://keirin\.tokyo-sports\.co\.jp/list/race/[^\s]+',url)
          except (ValueError, AssertionError):
              sys.exit('Invalid manual racecard inputs; no intake')
          PY
      - name: Collect one public racecard (preview only)
        if: github.event_name == 'workflow_dispatch' && inputs.historical_result_url == '' && inputs.historical_batch_plan == '' && inputs.source_url != ''
        env:
          RACE_DATE: ${{ inputs.race_date }}
          TRACK_CODE: ${{ inputs.track_code }}
          TRACK_NAME: ${{ inputs.track_name }}
          RACE_NUMBER: ${{ inputs.race_number }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          python scripts/collect_tospo_entry.py --date "$RACE_DATE" --track-code "$TRACK_CODE" --track "$TRACK_NAME" --race "$RACE_NUMBER" --url "$SOURCE_URL" --out /tmp/ki-manual-racecard.json
          python scripts/upsert_daily_sheets.py --input /tmp/ki-manual-racecard.json --validate-only
          python scripts/upsert_daily_sheets.py --input /tmp/ki-manual-racecard.json
      - name: Discover and validate venue racecards (manual preview)
        if: github.event_name == 'workflow_dispatch' && inputs.historical_result_url == '' && inputs.historical_batch_plan == '' && inputs.source_url == '' && inputs.race_date != '' && inputs.track_name != '' && inputs.track_code != ''
        env:
          RACE_DATE: ${{ inputs.race_date }}
          TRACK_CODE: ${{ inputs.track_code }}
          TRACK_NAME: ${{ inputs.track_name }}
        run: |
          python scripts/discover_tospo_races.py --date "$RACE_DATE" --track-code "$TRACK_CODE" --track "$TRACK_NAME" --out /tmp/ki-manual-racecard.json
          python scripts/upsert_daily_sheets.py --input /tmp/ki-manual-racecard.json --validate-only
          python scripts/upsert_daily_sheets.py --input /tmp/ki-manual-racecard.json
      - name: Reject mixed historical batch input modes
        if: github.event_name == 'workflow_dispatch' && inputs.historical_batch_plan != '' && (inputs.historical_result_url != '' || inputs.historical_second_url != '' || inputs.source_url != '' || inputs.verify_writer || inputs.apply_intake || inputs.race_date != '' || inputs.track_code != '' || inputs.track_name != '' || inputs.race_number != '')
        run: |
          echo "::error::Historical batch mode must be used alone; no writes"
          exit 1
      - name: Collect bounded historical batch (candidate only)
        if: github.event_name == 'workflow_dispatch' && inputs.historical_batch_plan != ''
        env:
          BATCH_PLAN: ${{ inputs.historical_batch_plan }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          plan=json.loads(os.environ["BATCH_PLAN"])
          Path('/tmp/ki-batch-plan.json').write_text(json.dumps(plan,ensure_ascii=False),encoding='utf-8')
          PY
          set +e
          python scripts/collect_historical_batch.py --plan /tmp/ki-batch-plan.json --out-dir /tmp/ki-batch-candidates
          rc=$?
          set -e
          if [ "$rc" -eq 2 ] && [ -f /tmp/ki-batch-candidates/batch-summary.json ]; then
            echo "::warning::Partial historical batch; summary and successful candidates preserved"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
      - name: Upload bounded historical batch candidates
        if: github.event_name == 'workflow_dispatch' && inputs.historical_batch_plan != '' && success()
        uses: actions/upload-artifact@v4
        with:
          name: historical-batch-candidates
          path: /tmp/ki-batch-candidates/
          retention-days: 7
          if-no-files-found: error
      - name: Reject mixed historical and daily write modes
        if: github.event_name == 'workflow_dispatch' && inputs.historical_result_url != '' && (inputs.apply_intake || inputs.verify_writer || inputs.source_url != '')
        run: |
          echo "::error::Historical preview may not request daily writes, writer verification or racecard input"
          exit 1
      - name: Validate historical preview input mode
        if: github.event_name == 'workflow_dispatch' && inputs.historical_second_url != '' && inputs.historical_result_url == '' && inputs.historical_batch_plan == ''
        run: |
          echo "::error::historical_second_url requires historical_result_url"
          exit 1
      - name: Collect one historical result (observation only)
        if: github.event_name == 'workflow_dispatch' && inputs.historical_result_url != '' && inputs.historical_second_url == ''
        env:
          RACE_DATE: ${{ inputs.race_date }}
          TRACK_CODE: ${{ inputs.track_code }}
          TRACK_NAME: ${{ inputs.track_name }}
          RACE_NUMBER: ${{ inputs.race_number }}
          CLASS_NAME: ${{ inputs.historical_class }}
          EXPECTED_CARS: ${{ inputs.historical_cars }}
          RESULT_URL: ${{ inputs.historical_result_url }}
        run: |
          python scripts/collect_netkeirin_result.py --date "$RACE_DATE" --track-code "$TRACK_CODE" --track "$TRACK_NAME" --race "$RACE_NUMBER" --class-name "$CLASS_NAME" --expected-cars "$EXPECTED_CARS" --url "$RESULT_URL" --out /tmp/ki-historical-observation.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/ki-historical-observation.json', encoding='utf-8'))
          assert x['sourceId']=='netkeirin-result' and len(x['results']) in (7,9)
          print('HISTORICAL_SOURCE_OBSERVATION_OK: full-car candidate, not formal PASS')
          PY
      - name: Collect and compare one historical race from two sources
        if: github.event_name == 'workflow_dispatch' && inputs.historical_result_url != '' && inputs.historical_second_url != ''
        env:
          RACE_DATE: ${{ inputs.race_date }}
          TRACK_CODE: ${{ inputs.track_code }}
          TRACK_NAME: ${{ inputs.track_name }}
          RACE_NUMBER: ${{ inputs.race_number }}
          CLASS_NAME: ${{ inputs.historical_class }}
          EXPECTED_CARS: ${{ inputs.historical_cars }}
          LEFT_URL: ${{ inputs.historical_result_url }}
          RIGHT_URL: ${{ inputs.historical_second_url }}
        run: |
          python scripts/collect_historical_pair.py --date "$RACE_DATE" --track-code "$TRACK_CODE" --track "$TRACK_NAME" --race "$RACE_NUMBER" --class-name "$CLASS_NAME" --expected-cars "$EXPECTED_CARS" --left-url "$LEFT_URL" --right-url "$RIGHT_URL" --out /tmp/ki-history-pair.json
      - name: Save two-source historical comparison candidate
        if: github.event_name == 'workflow_dispatch' && inputs.historical_result_url != '' && inputs.historical_second_url != ''
        uses: actions/upload-artifact@v4
        with:
          name: historical-two-source-candidate
          path: /tmp/ki-history-pair.json
          retention-days: 7
          if-no-files-found: error
      - name: Save historical observation as workflow artifact
        if: github.event_name == 'workflow_dispatch' && inputs.historical_result_url != '' && inputs.historical_second_url == ''
        uses: actions/upload-artifact@v4
        with:
          name: historical-result-observation
          path: /tmp/ki-historical-observation.json
          retention-days: 7
          if-no-files-found: error
      - name: Verify Sheets writer permission on explicitly tagged main push
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-sheets-writer]')
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json, os, sys
          expected = "keirin-insight-sheets-reader@possible-helix-433523-q9.iam.gserviceaccount.com"
          try:
              actual = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])["client_email"]
          except (KeyError, TypeError, ValueError):
              sys.exit("Missing or invalid credential; no write")
          if actual != expected:
              sys.exit("Credential identity mismatches approved editor; no write")
          print("SERVICE_ACCOUNT_IDENTITY_MATCH; email and credential withheld")
          PY
          python scripts/upsert_daily_sheets.py --verify-write-access
      - name: Manually verify Sheets writer without adding race rows
        if: github.event_name == 'workflow_dispatch' && inputs.historical_result_url == '' && inputs.historical_batch_plan == '' && inputs.verify_writer
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json, os, sys
          expected = "keirin-insight-sheets-reader@possible-helix-433523-q9.iam.gserviceaccount.com"
          try:
              actual = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])["client_email"]
          except (KeyError, ValueError, TypeError):
              sys.exit("Credential missing or malformed; no write")
          if actual != expected:
              sys.exit("Credential identity mismatches approved editor; no write")
          print("SERVICE_ACCOUNT_IDENTITY_MATCH (credential withheld)")
          PY
          python scripts/upsert_daily_sheets.py --verify-write-access
      - name: Verify private Sheets service-account identity before write
        if: github.event_name == 'workflow_dispatch' && inputs.historical_result_url == '' && inputs.historical_batch_plan == '' && inputs.apply_intake
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json, os, sys
          expected = "keirin-insight-sheets-reader@possible-helix-433523-q9.iam.gserviceaccount.com"
          try:
              identity = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])["client_email"]
          except (KeyError, ValueError, TypeError):
              sys.exit("Sheets credential missing or invalid; no write attempted")
          if identity != expected:
              sys.exit("Sheets credential identity does not match approved editor; no write attempted")
          print("SERVICE_ACCOUNT_IDENTITY_MATCH: approved editor (credential withheld)")
          PY
      - name: Save validated manual racecard to daily intake tab
        if: github.event_name == 'workflow_dispatch' && inputs.historical_result_url == '' && inputs.historical_batch_plan == '' && inputs.apply_intake && (inputs.source_url != '' || (inputs.race_date != '' && inputs.track_name != '' && inputs.track_code != ''))
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/upsert_daily_sheets.py --input /tmp/ki-manual-racecard.json --apply
      # Every listed venue is processed in its own <=12R/108-car transaction.
      # Incomplete or conflicting venues are reported; no all-day 36R cap.
      - name: Auto-collect bounded today and tomorrow entries before daily feed
        if: github.event_name == 'schedule'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python scripts/auto_daily_tospo_intake.py --apply --days 2 --max-venues 43
      # Stored racecards are independently eligible for result retries. Even if
      # today's venue-index fetch fails, keep this step running and retain the
      # earlier step's failure status; never mark the workflow as successful.
      - name: Collect two-source daily results for completed stored races
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -o pipefail
          python scripts/auto_daily_results.py --apply --max-races 12 --max-seconds 720 --lookback-days 7 | tee /tmp/ki-daily-result-intake.json
          python - <<'PY'
          import collections, json, os, re
          from pathlib import Path
          report = json.loads(Path("/tmp/ki-daily-result-intake.json").read_text())
          if (report.get("schema") != "ki-daily-result-intake-v1" or
                  report.get("formalPass") is not False or
                  not isinstance(report.get("results"), list)):
              raise ValueError("Invalid/unexpected daily intake report; do not mark success")
          statuses = collections.Counter(r.get("status", "UNKNOWN") for r in report["results"])
          holds = collections.Counter((r.get("failurePhase", "UNSPECIFIED"),
                                       r.get("reasonCode", "UNCLASSIFIED"))
                                      for r in report["results"] if not r.get("saved") and r.get("reasonCode"))
          lanes = collections.Counter(r.get("reviewRoute", "UNCLASSIFIED")
                                      for r in report["results"] if r.get("reviewRoute"))
          stages = collections.Counter(r.get("sourceStage") for r in report["results"]
                                       if r.get("sourceStage"))
          rows = [
              "## Daily two-source result intake",
              f"- Pending eligible races: {report['eligibleTotal']}",
              f"- Attempted: {report['eligibleExamined']}",
              f"- Deferred: {report['eligibleDeferred']}",
              f"- Not yet due (no verified start time or before start+20m): {report.get('notYetDueCount', 0)}",
              f"- Saved: {report['savedCount']}",
              f"- LotoPlace fallback comparisons: {sum(bool(r.get('alternateSourceUsed')) for r in report['results'])}",
              f"- Chariloto + LotoPlace complete-pair fallback: {sum(r.get('sourcePairMode') == 'CHARILOTO_LOTOPLACE_FALLBACK' for r in report['results'])}",
              f"- Time budget reached: {report['timeBudgetExceeded']}",
              f"- Stored partial/identity conflicts: {report.get('partialExistingCount', 0)}",
              "",
              "| Status | Races |",
              "|---|---:|",
          ]
          rows += [f"| {key} | {count} |" for key, count in sorted(statuses.items())]
          rows += ["", "| Failure phase / reason | Races |", "|---|---:|"]
          rows += [f"| {phase} / {reason} | {count} |"
                   for (phase, reason), count in sorted(holds.items())]
          rows += ["", "| Suggested review lane | Races |", "|---|---:|"]
          rows += [f"| {lane} | {count} |" for lane, count in sorted(lanes.items())]
          rows += ["", "| Failed source stage | Races |", "|---|---:|"]
          rows += [f"| {stage} | {count} |" for stage, count in sorted(stages.items())]
          held = [r for r in report["results"] if not r.get("saved") and r.get("reasonCode")]
          if held:
              rows += ["", "| Pending race | Source stage | Reason | Review lane |",
                       "|---|---|---|---|"]
              # Bounded job-local diagnostic. Never publish raw exceptions,
              # untrusted HTML, source tokens or person identifiers.
              for item in held[:20]:
                  race_key = item.get("raceKey", "")
                  if not re.fullmatch(r"20\d{2}-\d{2}-\d{2}\|\d{2}\|(?:[1-9]|1[0-2])", race_key):
                      continue
                  values = [race_key,
                            item.get("sourceStage") or "OTHER",
                            item.get("reasonCode") or "UNCLASSIFIED",
                            item.get("reviewRoute") or "UNCLASSIFIED"]
                  if all(re.fullmatch(r"[A-Z0-9_]+", str(v)) for v in values[1:]):
                      rows.append("| " + " | ".join(values) + " |")
          if report.get("partialExisting"):
              rows += ["", "| Stored-result review | Missing cars | Duplicate cars | Identity mismatch |",
                       "|---|---|---|---|"]
              for item in report["partialExisting"][:10]:
                  def cell(name):
                      values = item.get(name, [])
                      return ",".join(map(str, values)) if values else "—"
                  rows.append(f"| {item['raceKey']} | {cell('missingCarNumbers')} | "
                              f"{cell('duplicateCarNumbers')} | {cell('identityMismatchCars')} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(rows) + "\n")
          PY
      - name: Build daily board
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.historical_result_url == '' && inputs.historical_batch_plan == '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh-daily-feed]'))
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build_daily_board.py --out daily-board-feed-v1.json
      # Source identity and full rider field must agree before exposing startTime.
      - name: Enrich daily start times using the original racecard sources
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.historical_result_url == '' && inputs.historical_batch_plan == '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh-daily-feed]'))
        run: python scripts/enrich_daily_start_times.py --limit 36
      # Single-source last-four-month stats remain unverified, never formal PASS.
      # Missing full rider identity or numeric S/B must remain on a bounded retry hold.
      - name: Enrich rider statistics only for complete identity-matched racecards
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.historical_result_url == '' && inputs.historical_batch_plan == '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh-daily-feed]'))
        run: python scripts/enrich_daily_rider_stats.py --limit 8
      - name: Commit changed daily feed only
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.historical_result_url == '' && inputs.historical_batch_plan == '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh-daily-feed]'))
        run: |
          git add daily-board-feed-v1.json daily-race-start-times-v1.json daily-rider-stats-v1.json
          if git diff --cached --quiet; then
            echo 'Daily feed unchanged; no commit or duplicate validation.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update daily entries and results snapshot [skip ci]'
          # Other authorized tasks may update main during this job. Replay only
          # this three-feed commit on the current main; never force-push.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Daily feed rebase conflict; leave main unchanged for review."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "DAILY_FEED_PUBLISHED: rebased and pushed without force"
              exit 0
            fi
            echo "::warning::main advanced during daily feed publish (attempt ${attempt}); retrying."
            sleep 2
          done
          echo "::error::Daily feed publication retries exhausted; main unchanged."
          exit 1
