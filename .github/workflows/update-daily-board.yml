name: Update daily race board
on:
  push:
    paths:
      - '.github/workflows/update-daily-board.yml'
      - 'scripts/compare_race_results.py'
      - 'scripts/collect_netkeirin_result.py'
      - 'scripts/collect_lotoplace_result.py'
      - 'scripts/collect_historical_pair.py'
  pull_request:
    paths:
      - 'scripts/collect_chariloto_entry.py'
      - 'scripts/probe_daily_source.py'
      - 'scripts/collect_tospo_entry.py'
      - 'scripts/discover_tospo_races.py'
      - 'scripts/compare_race_results.py'
      - 'scripts/collect_netkeirin_result.py'
      - 'scripts/collect_lotoplace_result.py'
      - 'scripts/collect_historical_pair.py'
      - 'scripts/upsert_daily_sheets.py'
      - 'scripts/build_daily_board.py'
      - '.github/workflows/update-daily-board.yml'
  workflow_dispatch:
    inputs:
      race_date:
        description: 'Race date YYYY-MM-DD (manual one-race intake only)'
        required: false
        type: string
      track_code:
        description: 'Track code, e.g. 26'
        required: false
        type: string
      track_name:
        description: 'Japanese track name, e.g. 西武園'
        required: false
        type: string
      race_number:
        description: 'Race number, 1-12'
        required: false
        type: string
      source_url:
        description: 'Optional individual racecard URL; leave blank to discover venue racecards'
        required: false
        type: string
      historical_result_url:
        description: 'Optional netkeirin historical result page (read-only)'
        required: false
        type: string
      historical_second_url:
        description: 'Optional Chariloto or LotoPlace event-day results URL'
        required: false
        type: string
      historical_class:
        description: 'Class for historical race, e.g. A3'
        required: false
        type: string
      historical_cars:
        description: 'Expected historical cars: 7 or 9'
        required: false
        type: string
      verify_writer:
        description: 'Verify writer access without changing race rows'
        required: false
        default: false
        type: boolean
      apply_intake:
        description: 'Write validated racecard to daily entry tab (requires Sheets editor permission)'
        required: false
        default: false
        type: boolean
  schedule:
    # UTC corresponds to JST 07:10, 12:10, 17:10, 22:10.
    - cron: '10 22,3,8,13 * * *'
permissions:
  contents: write
concurrency:
  group: keirin-daily-board
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check read-only Sheets credential
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.historical_result_url == '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-sheets-writer]'))
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing GOOGLE_SERVICE_ACCOUNT_JSON. Daily feed unchanged."
            exit 1
          fi
      - name: Install Google reader
        run: pip install 'google-auth==2.38.0' 'requests==2.32.3' 'beautifulsoup4==4.14.2'
      - name: Check daily intake script syntax
        run: |
          python -m py_compile scripts/build_daily_board.py scripts/upsert_daily_sheets.py scripts/collect_chariloto_entry.py scripts/probe_daily_source.py scripts/collect_tospo_entry.py scripts/discover_tospo_races.py scripts/compare_race_results.py scripts/collect_netkeirin_result.py scripts/collect_lotoplace_result.py scripts/collect_historical_pair.py
          python scripts/collect_chariloto_entry.py --self-test
          python scripts/collect_tospo_entry.py --self-test
          python scripts/discover_tospo_races.py --self-test
          python scripts/compare_race_results.py --self-test
          python scripts/collect_netkeirin_result.py --self-test
          python scripts/collect_lotoplace_result.py --self-test
          python scripts/build_daily_board.py --self-test
      - name: TEMP verify reusable historical pair command against live public 7-car race
        if: github.event_name == 'pull_request'
        run: |
          python scripts/collect_historical_pair.py --date 2026-09-10 --track-code 27 --track 京王閣 --race 2 --class-name A3 --expected-cars 7 --out /tmp/ki-history-pair-test.json
          python - <<'PY'
          import json
          x = json.load(open('/tmp/ki-history-pair-test.json',encoding='utf-8'))
          c=x['comparison']
          assert c['carCount']==7 and c['disagreements']==[] and c['formalPass'] is False
          assert c['status']=='SOURCE_CONTENT_MATCH_INDEPENDENCE_PENDING'
          print('PAIR_LIVE_SELF_CHECK_OK: 7 cars, zero conflicts, candidate only')
          PY
      - name: Validate manually supplied racecard fields
        if: github.event_name == 'workflow_dispatch' && inputs.historical_result_url == '' && inputs.source_url != ''
        env:
          RACE_DATE: ${{ inputs.race_date }}
          TRACK_CODE: ${{ inputs.track_code }}
          TRACK_NAME: ${{ inputs.track_name }}
          RACE_NUMBER: ${{ inputs.race_number }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          python - <<'PY'
          import os, re, sys
          from datetime import date
          values = [os.environ[x] for x in ('RACE_DATE','TRACK_CODE','TRACK_NAME','RACE_NUMBER','SOURCE_URL')]
          d, code, track, race, url = values
          try:
              date.fromisoformat(d)
              assert re.fullmatch(r'20\d{2}-\d{2}-\d{2}', d)
              assert code.isdigit() and 1 <= int(code) <= 99
              assert track.strip()
              assert race.isdigit() and 1 <= int(race) <= 12
              assert re.fullmatch(r'https://keirin\.tokyo-sports\.co\.jp/list/race/[^\s]+',url)
          except (ValueError, AssertionError):
              sys.exit('Invalid manual racecard inputs; no intake')
          PY
      - name: Collect one public racecard (preview only)
        if: github.event_name == 'workflow_dispatch' && inputs.historical_result_url == '' && inputs.source_url != ''
        env:
          RACE_DATE: ${{ inputs.race_date }}
          TRACK_CODE: ${{ inputs.track_code }}
          TRACK_NAME: ${{ inputs.track_name }}
          RACE_NUMBER: ${{ inputs.race_number }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          python scripts/collect_tospo_entry.py --date "$RACE_DATE" --track-code "$TRACK_CODE" --track "$TRACK_NAME" --race "$RACE_NUMBER" --url "$SOURCE_URL" --out /tmp/ki-manual-racecard.json
          python scripts/upsert_daily_sheets.py --input /tmp/ki-manual-racecard.json --validate-only
          python scripts/upsert_daily_sheets.py --input /tmp/ki-manual-racecard.json
      - name: Discover and validate venue racecards (manual preview)
        if: github.event_name == 'workflow_dispatch' && inputs.historical_result_url == '' && inputs.source_url == '' && inputs.race_date != '' && inputs.track_name != '' && inputs.track_code != ''
        env:
          RACE_DATE: ${{ inputs.race_date }}
          TRACK_CODE: ${{ inputs.track_code }}
          TRACK_NAME: ${{ inputs.track_name }}
        run: |
          python scripts/discover_tospo_races.py --date "$RACE_DATE" --track-code "$TRACK_CODE" --track "$TRACK_NAME" --out /tmp/ki-manual-racecard.json
          python scripts/upsert_daily_sheets.py --input /tmp/ki-manual-racecard.json --validate-only
          python scripts/upsert_daily_sheets.py --input /tmp/ki-manual-racecard.json
      - name: Reject mixed historical and daily write modes
        if: github.event_name == 'workflow_dispatch' && inputs.historical_result_url != '' && (inputs.apply_intake || inputs.verify_writer || inputs.source_url != '')
        run: |
          echo "::error::Historical preview may not request daily writes, writer verification or racecard input"
          exit 1
      - name: Validate historical preview input mode
        if: github.event_name == 'workflow_dispatch' && inputs.historical_second_url != '' && inputs.historical_result_url == ''
        run: |
          echo "::error::historical_second_url requires historical_result_url"
          exit 1
      - name: Collect one historical result (observation only)
        if: github.event_name == 'workflow_dispatch' && inputs.historical_result_url != '' && inputs.historical_second_url == ''
        env:
          RACE_DATE: ${{ inputs.race_date }}
          TRACK_CODE: ${{ inputs.track_code }}
          TRACK_NAME: ${{ inputs.track_name }}
          RACE_NUMBER: ${{ inputs.race_number }}
          CLASS_NAME: ${{ inputs.historical_class }}
          EXPECTED_CARS: ${{ inputs.historical_cars }}
          RESULT_URL: ${{ inputs.historical_result_url }}
        run: |
          python scripts/collect_netkeirin_result.py --date "$RACE_DATE" --track-code "$TRACK_CODE" --track "$TRACK_NAME" --race "$RACE_NUMBER" --class-name "$CLASS_NAME" --expected-cars "$EXPECTED_CARS" --url "$RESULT_URL" --out /tmp/ki-historical-observation.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/ki-historical-observation.json', encoding='utf-8'))
          assert x['sourceId']=='netkeirin-result' and len(x['results']) in (7,9)
          print('HISTORICAL_SOURCE_OBSERVATION_OK: full-car candidate, not formal PASS')
          PY
      - name: Collect and compare one historical race from two sources
        if: github.event_name == 'workflow_dispatch' && inputs.historical_result_url != '' && inputs.historical_second_url != ''
        env:
          RACE_DATE: ${{ inputs.race_date }}
          TRACK_CODE: ${{ inputs.track_code }}
          TRACK_NAME: ${{ inputs.track_name }}
          RACE_NUMBER: ${{ inputs.race_number }}
          CLASS_NAME: ${{ inputs.historical_class }}
          EXPECTED_CARS: ${{ inputs.historical_cars }}
          LEFT_URL: ${{ inputs.historical_result_url }}
          RIGHT_URL: ${{ inputs.historical_second_url }}
        run: |
          python scripts/collect_historical_pair.py --date "$RACE_DATE" --track-code "$TRACK_CODE" --track "$TRACK_NAME" --race "$RACE_NUMBER" --class-name "$CLASS_NAME" --expected-cars "$EXPECTED_CARS" --left-url "$LEFT_URL" --right-url "$RIGHT_URL" --out /tmp/ki-history-pair.json
      - name: Save two-source historical comparison candidate
        if: github.event_name == 'workflow_dispatch' && inputs.historical_result_url != '' && inputs.historical_second_url != ''
        uses: actions/upload-artifact@v4
        with:
          name: historical-two-source-candidate
          path: /tmp/ki-history-pair.json
          retention-days: 7
          if-no-files-found: error
      - name: Save historical observation as workflow artifact
        if: github.event_name == 'workflow_dispatch' && inputs.historical_result_url != '' && inputs.historical_second_url == ''
        uses: actions/upload-artifact@v4
        with:
          name: historical-result-observation
          path: /tmp/ki-historical-observation.json
          retention-days: 7
          if-no-files-found: error
      - name: Verify Sheets writer permission on explicitly tagged main push
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-sheets-writer]')
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json, os, sys
          expected = "keirin-insight-sheets-reader@possible-helix-433523-q9.iam.gserviceaccount.com"
          try:
              actual = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])["client_email"]
          except (KeyError, TypeError, ValueError):
              sys.exit("Missing or invalid credential; no write")
          if actual != expected:
              sys.exit("Credential identity mismatches approved editor; no write")
          print("SERVICE_ACCOUNT_IDENTITY_MATCH; email and credential withheld")
          PY
          python scripts/upsert_daily_sheets.py --verify-write-access
      - name: Manually verify Sheets writer without adding race rows
        if: github.event_name == 'workflow_dispatch' && inputs.historical_result_url == '' && inputs.verify_writer
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json, os, sys
          expected = "keirin-insight-sheets-reader@possible-helix-433523-q9.iam.gserviceaccount.com"
          try:
              actual = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])["client_email"]
          except (KeyError, ValueError, TypeError):
              sys.exit("Credential missing or malformed; no write")
          if actual != expected:
              sys.exit("Credential identity mismatches approved editor; no write")
          print("SERVICE_ACCOUNT_IDENTITY_MATCH (credential withheld)")
          PY
          python scripts/upsert_daily_sheets.py --verify-write-access
      - name: Verify private Sheets service-account identity before write
        if: github.event_name == 'workflow_dispatch' && inputs.historical_result_url == '' && inputs.apply_intake
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json, os, sys
          expected = "keirin-insight-sheets-reader@possible-helix-433523-q9.iam.gserviceaccount.com"
          try:
              identity = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])["client_email"]
          except (KeyError, ValueError, TypeError):
              sys.exit("Sheets credential missing or invalid; no write attempted")
          if identity != expected:
              sys.exit("Sheets credential identity does not match approved editor; no write attempted")
          print("SERVICE_ACCOUNT_IDENTITY_MATCH: approved editor (credential withheld)")
          PY
      - name: Save validated manual racecard to daily intake tab
        if: github.event_name == 'workflow_dispatch' && inputs.historical_result_url == '' && inputs.apply_intake && (inputs.source_url != '' || (inputs.race_date != '' && inputs.track_name != '' && inputs.track_code != ''))
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/upsert_daily_sheets.py --input /tmp/ki-manual-racecard.json --apply
      - name: Build daily board
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.historical_result_url == '')
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build_daily_board.py --out daily-board-feed-v1.json
      - name: Commit changed daily feed only
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.historical_result_url == '')
        run: |
          git add daily-board-feed-v1.json
          if git diff --cached --quiet; then
            echo 'Daily feed unchanged; no commit or duplicate validation.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update daily entries and results snapshot [skip ci]'
          git push
