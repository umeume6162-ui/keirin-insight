name: Probe Maebashi Oct 2 historical A3 seven races
on:
  push:
    paths: ['.github/workflows/probe-maebashi-20261002.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests==2.32.3' 'beautifulsoup4==4.14.2'
      - name: Read-only 49-rider V99 comparison with public result page
        run: |
          python - <<'PY'
          import sys,json
          sys.path.insert(0,'scripts')
          import collect_lotoplace_result as source
          from compare_race_results import normalized_name,normalized_prefecture,canonical_method
          baseline=json.loads('''{"1":[{"number":2,"name":"山田祐太","prefecture":"福島","period":"113","finish":"1","method":"逃げ","exception":""},{"number":5,"name":"浦崎貴史","prefecture":"北海","period":"75","finish":"2","method":"マーク","exception":""},{"number":1,"name":"山崎光展","prefecture":"京都","period":"93","finish":"3","method":"","exception":""},{"number":6,"name":"川西亮介","prefecture":"和歌","period":"86","finish":"4","method":"","exception":""},{"number":4,"name":"旭啓介","prefecture":"神奈","period":"86","finish":"5","method":"","exception":""},{"number":3,"name":"鈴木広人","prefecture":"神奈","period":"99","finish":"6","method":"","exception":""},{"number":7,"name":"井上典善","prefecture":"千葉","period":"66","finish":"7","method":"","exception":""}],"2":[{"number":5,"name":"後田康成","prefecture":"長崎","period":"75","finish":"1","method":"差し","exception":""},{"number":4,"name":"小川辰徳","prefecture":"埼玉","period":"100","finish":"2","method":"逃げ","exception":""},{"number":1,"name":"女屋文伸","prefecture":"埼玉","period":"83","finish":"3","method":"","exception":""},{"number":2,"name":"瓦田勝也","prefecture":"福岡","period":"77","finish":"4","method":"","exception":""},{"number":7,"name":"遠澤健二","prefecture":"神奈","period":"57","finish":"5","method":"","exception":""},{"number":3,"name":"吉野猛","prefecture":"愛知","period":"74","finish":"6","method":"","exception":""},{"number":6,"name":"友永龍介","prefecture":"山口","period":"101","finish":"7","method":"","exception":""}],"3":[{"number":1,"name":"大竹野裕樹","prefecture":"鹿児","period":"88","finish":"1","method":"捲くり","exception":""},{"number":4,"name":"福田悠航","prefecture":"福島","period":"129","finish":"2","method":"逃げ","exception":""},{"number":3,"name":"榊枝輝文","prefecture":"福島","period":"79","finish":"3","method":"","exception":""},{"number":2,"name":"永田修一","prefecture":"熊本","period":"90","finish":"4","method":"","exception":""},{"number":7,"name":"山内大作","prefecture":"静岡","period":"75","finish":"5","method":"","exception":""},{"number":6,"name":"山本宏明","prefecture":"徳島","period":"83","finish":"6","method":"","exception":""},{"number":5,"name":"増成富夫","prefecture":"岡山","period":"66","finish":"7","method":"","exception":""}],"4":[{"number":1,"name":"山本淳","prefecture":"神奈","period":"94","finish":"1","method":"差し","exception":""},{"number":3,"name":"小泉俊也","prefecture":"静岡","period":"77","finish":"2","method":"逃げ","exception":""},{"number":5,"name":"土居佑次","prefecture":"高知","period":"113","finish":"3","method":"","exception":""},{"number":2,"name":"松本一志","prefecture":"宮崎","period":"117","finish":"4","method":"","exception":""},{"number":7,"name":"吉原友彦","prefecture":"神奈","period":"83","finish":"5","method":"","exception":""},{"number":4,"name":"小磯知也","prefecture":"徳島","period":"76","finish":"6","method":"","exception":""},{"number":6,"name":"木下章","prefecture":"長野","period":"61","finish":"7","method":"","exception":""}],"5":[{"number":5,"name":"内海雅夫","prefecture":"群馬","period":"83","finish":"1","method":"差し","exception":""},{"number":1,"name":"北村篤","prefecture":"岐阜","period":"94","finish":"2","method":"差し","exception":""},{"number":7,"name":"猪野泰介","prefecture":"山形","period":"111","finish":"3","method":"","exception":""},{"number":3,"name":"臼井昌巨","prefecture":"愛知","period":"89","finish":"4","method":"","exception":""},{"number":6,"name":"沼川夢久","prefecture":"群馬","period":"81","finish":"5","method":"","exception":""},{"number":4,"name":"井上剛","prefecture":"岡山","period":"85","finish":"6","method":"","exception":""},{"number":2,"name":"沢田勇治","prefecture":"山口","period":"98","finish":"7","method":"","exception":""}],"6":[{"number":3,"name":"北宅柊麻","prefecture":"大阪","period":"129","finish":"1","method":"逃げ","exception":""},{"number":2,"name":"山村慮太","prefecture":"大阪","period":"97","finish":"2","method":"マーク","exception":""},{"number":1,"name":"山本恵太郎","prefecture":"東京","period":"71","finish":"3","method":"","exception":""},{"number":5,"name":"阿部利光","prefecture":"宮城","period":"77","finish":"4","method":"","exception":""},{"number":4,"name":"西巻秀太","prefecture":"新潟","period":"97","finish":"5","method":"","exception":""},{"number":6,"name":"前川裕希","prefecture":"北海","period":"95","finish":"6","method":"","exception":""},{"number":7,"name":"田山誠","prefecture":"長崎","period":"96","finish":"7","method":"","exception":""}],"7":[{"number":3,"name":"中西将太郎","prefecture":"東京","period":"129","finish":"1","method":"捲くり","exception":""},{"number":1,"name":"坂井央雅","prefecture":"岐阜","period":"129","finish":"2","method":"捲くり","exception":""},{"number":5,"name":"内田淳","prefecture":"千葉","period":"111","finish":"3","method":"","exception":""},{"number":2,"name":"大村涼兼","prefecture":"神奈","period":"129","finish":"4","method":"","exception":""},{"number":6,"name":"松本大地","prefecture":"熊本","period":"81","finish":"5","method":"","exception":""},{"number":7,"name":"北村翔太","prefecture":"群馬","period":"129","finish":"6","method":"","exception":""},{"number":4,"name":"舟山佑京","prefecture":"新潟","period":"113","finish":"7","method":"","exception":""}]}''')
          day,code,track='2026-10-02','22','前橋'
          url='https://www.chariloto.com/keirin/results/22/2026-10-02/'
          try:
              html=source.fetch(url)
          except Exception as exc:
              print('MAEBASHI_FETCH_HOLD',type(exc).__name__,str(exc)[:130])
              raise SystemExit(0)
          for race in range(1,8):
              key=f'{day}|{code}|{race}'
              try:
                  result=source.parse_result(html,day,code,track,race,'A3',7,url)
                  got={int(x['number']):x for x in result['results']}
                  mismatch=[]
                  for rider in baseline[str(race)]:
                      actual=got.get(rider['number'])
                      if not actual: mismatch.append((rider['number'],'missing'));continue
                      for field,normal in (('name',normalized_name),('prefecture',normalized_prefecture),
                           ('period',str),('finish',str),('method',canonical_method),('exception',str)):
                          if normal(actual.get(field,'') or '')!=normal(rider[field]):
                              mismatch.append((rider['number'],field))
                  print('MAEBASHI_V99_COMPARE',key,'PASS' if not mismatch else 'HOLD','cars',len(got),'mismatchCount',len(mismatch),'details',mismatch[:8])
              except Exception as exc:
                  print('MAEBASHI_V99_HOLD',key,type(exc).__name__,str(exc)[:130])
          PY
