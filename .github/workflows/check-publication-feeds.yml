name: Check publication feed integrity
on:
  push:
    paths:
      - 'verified-rider-ids-feed-v1.json'
      - 'verified-results-feed-v1.json'
      - 'verified-rider-results-feed-v1.json'
      - 'verified-line-snapshots-feed-v1.json'
      - 'comparison-races-v1.json'
      - 'tools/check_publication_completeness.cjs'
      - 'tools/test_mobile_result_contract.cjs'
      - 'verified-publication-guard-v138.js'
      - 'index.html'
      - 'line-forecast.html'
      - 'tools/test_single_source_forecast.cjs'
      - 'race-result-detail.html'
      - 'race-index-live.html'
      - 'reconstruction-status.html'
      - '.github/workflows/check-publication-feeds.yml'
  pull_request:
    paths:
      - 'verified-rider-ids-feed-v1.json'
      - 'verified-results-feed-v1.json'
      - 'verified-rider-results-feed-v1.json'
      - 'verified-line-snapshots-feed-v1.json'
      - 'comparison-races-v1.json'
      - 'tools/check_publication_completeness.cjs'
      - 'tools/test_mobile_result_contract.cjs'
      - 'verified-publication-guard-v138.js'
      - 'index.html'
      - 'line-forecast.html'
      - 'tools/test_single_source_forecast.cjs'
      - 'race-result-detail.html'
      - 'race-index-live.html'
      - 'reconstruction-status.html'
      - '.github/workflows/check-publication-feeds.yml'
  workflow_dispatch:
  schedule:
    # Check deployed data after the usual publication/propagation window.
    - cron: '45 * * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Every published change gets the publication integrity gate.
      - name: Check published rider, race and line feeds
        run: node tools/check_publication_completeness.cjs
      - name: Check mobile race-result presentation contract
        if: ${{ success() || failure() }}
        run: node tools/test_mobile_result_contract.cjs

  deployed:
    # Use current main for scheduled/manual checks or an explicitly tagged push.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-pages]')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare deployed JSON with the checked-out main revision
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import URLError
          base = 'https://umeume6162-ui.github.io/keirin-insight/'
          feeds = ('verified-results-feed-v1.json', 'verified-rider-results-feed-v1.json',
                   'verified-rider-ids-feed-v1.json', 'verified-line-snapshots-feed-v1.json',
                   'daily-board-feed-v1.json', 'collection-status-snapshot-v1.json',
                   'ledger-status-snapshot-v1.json')
          archive = sorted(Path('daily-history').glob('[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].json'))
          if not archive:
              raise SystemExit('Daily history files missing from main')
          daily = json.loads(Path('daily-board-feed-v1.json').read_text(encoding='utf-8'))
          outside_daily = [p for p in archive if p.stem < daily['windowStart']]
          sample = (outside_daily or archive)[-1]
          pending = [*feeds, sample.as_posix()]
          for attempt in range(3):
              failures = []
              for name in pending:
                  try:
                      url = base + name + '?audit=' + str(time.time_ns())
                      req = Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'KEIRIN-INSIGHT-Deployment-Audit/1.0'})
                      with urlopen(req, timeout=8) as resp:
                          if not resp.geturl().startswith(base):
                              raise ValueError('unexpected redirect')
                          remote = json.load(resp)
                      local = json.loads(Path(name).read_text(encoding='utf-8'))
                      if remote != local:
                          raise ValueError('deployed JSON differs from checked-out main')
                      print('PAGES_MATCH', name, flush=True)
                  except (OSError, ValueError, URLError) as exc:
                      print('PAGES_PENDING', name, type(exc).__name__, str(exc)[:160], flush=True)
                      failures.append(name)
              pending = failures
              if not pending:
                  break
              if attempt < 2:
                  time.sleep(45)
          if pending:
              raise SystemExit('Pages not synchronized or unavailable: ' + ', '.join(pending))
          print('PAGES_JSON_MATCH_ALL; browser/device rendering not verified')
          PY
