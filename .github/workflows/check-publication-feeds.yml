name: Check publication feed integrity
on:
  push:
    paths:
      - 'verified-rider-ids-feed-v1.json'
      - 'verified-results-feed-v1.json'
      - 'verified-rider-results-feed-v1.json'
      - 'verified-line-snapshots-feed-v1.json'
      - 'comparison-races-v1.json'
      - 'tools/check_publication_completeness.cjs'
      - 'tools/reconcile_race_entries.cjs'
      - 'tools/reconcile_reconstructed_race.cjs'
      - 'tools/test_audit_official_primary_candidate.cjs'
      - 'tools/audit_official_primary_candidate.cjs'
      - 'tools/test_reconcile_reconstructed_race.cjs'
      - 'tools/reconstruction-candidates/**'
      - 'tools/audit_formal_race_readiness.cjs'
      - '.github/workflows/check-publication-feeds.yml'
  pull_request:
    paths:
      - 'verified-rider-ids-feed-v1.json'
      - 'verified-results-feed-v1.json'
      - 'verified-rider-results-feed-v1.json'
      - 'verified-line-snapshots-feed-v1.json'
      - 'comparison-races-v1.json'
      - 'tools/check_publication_completeness.cjs'
      - 'tools/reconcile_reconstructed_race.cjs'
      - 'tools/test_audit_official_primary_candidate.cjs'
      - 'tools/audit_official_primary_candidate.cjs'
      - 'tools/test_reconcile_reconstructed_race.cjs'
      - 'tools/reconstruction-candidates/**'
      - '.github/workflows/check-publication-feeds.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source-first entry/result exception reconciliation
        run: node tools/test_reconcile_reconstructed_race.cjs
      - name: Test official-primary evidence comparison (no implicit PASS)
        run: node tools/test_audit_official_primary_candidate.cjs
      - name: Run missing-rider reconciliation tests
        run: node tools/reconcile_race_entries.cjs
      - name: Audit formal race readiness (read-only)
        run: node tools/audit_formal_race_readiness.cjs
      - name: Validate published feeds and two-source evidence metadata
        run: node tools/check_publication_completeness.cjs
