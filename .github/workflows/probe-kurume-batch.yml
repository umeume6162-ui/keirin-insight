name: Probe Kurume historical seven race batch (read-only)
on:
  push:
    paths:
      - '.github/workflows/probe-kurume-batch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests==2.32.3' 'beautifulsoup4==4.14.2'
      - name: Test 2026-10-01 Kurume 5R-11R from one daily original HTML
        run: |
          python - <<'PY'
          import sys,json
          sys.path.insert(0,'scripts')
          import collect_lotoplace_result as src
          from compare_race_results import normalized_name,normalized_prefecture,canonical_method
          expected=json.loads('''{"5":[{"number":4,"name":"畠山ひすい","prefecture":"神奈","period":"122","finish":"1","method":"捲くり","exception":"","riderClass":"L1"},{"number":1,"name":"野口諭実可","prefecture":"大分","period":"102","finish":"2","method":"マーク","exception":"","riderClass":"L1"},{"number":5,"name":"鈴木美教","prefecture":"静岡","period":"112","finish":"3","method":"","exception":"","riderClass":"L1"},{"number":2,"name":"小泉夢菜","prefecture":"埼玉","period":"122","finish":"4","method":"","exception":"","riderClass":"L1"},{"number":7,"name":"高橋朋恵","prefecture":"東京","period":"108","finish":"5","method":"","exception":"","riderClass":"L1"},{"number":3,"name":"向井円","prefecture":"大阪","period":"114","finish":"6","method":"","exception":"","riderClass":"L1"},{"number":6,"name":"仲井リコ","prefecture":"岐阜","period":"130","finish":"7","method":"","exception":"","riderClass":"L1"}],"6":[{"number":7,"name":"児玉碧衣","prefecture":"福岡","period":"108","finish":"1","method":"捲くり","exception":"","riderClass":"L1"},{"number":1,"name":"又多風緑","prefecture":"石川","period":"122","finish":"2","method":"マーク","exception":"","riderClass":"L1"},{"number":2,"name":"板根茜弥","prefecture":"東京","period":"110","finish":"3","method":"","exception":"","riderClass":"L1"},{"number":3,"name":"栗山百花","prefecture":"神奈","period":"130","finish":"4","method":"","exception":"","riderClass":"L1"},{"number":4,"name":"西脇美唯奈","prefecture":"愛知","period":"120","finish":"5","method":"","exception":"","riderClass":"L1"},{"number":5,"name":"大和久保美","prefecture":"青森","period":"102","finish":"6","method":"","exception":"","riderClass":"L1"},{"number":6,"name":"日野友葵","prefecture":"愛媛","period":"108","finish":"7","method":"","exception":"","riderClass":"L1"}],"7":[{"number":7,"name":"西森一稀","prefecture":"兵庫","period":"127","finish":"1","method":"捲くり","exception":"","riderClass":"A2"},{"number":1,"name":"玉手翔","prefecture":"兵庫","period":"91","finish":"2","method":"マーク","exception":"","riderClass":"A1"},{"number":3,"name":"山田雅之","prefecture":"岐阜","period":"72","finish":"3","method":"","exception":"","riderClass":"A2"},{"number":5,"name":"四元慎也","prefecture":"宮崎","period":"77","finish":"4","method":"","exception":"","riderClass":"A2"},{"number":4,"name":"船曳義之","prefecture":"香川","period":"83","finish":"5","method":"","exception":"","riderClass":"A2"},{"number":2,"name":"白濱一平","prefecture":"長崎","period":"111","finish":"6","method":"","exception":"","riderClass":"A2"},{"number":6,"name":"片折勇輝","prefecture":"福岡","period":"95","finish":"7","method":"","exception":"","riderClass":"A2"}],"8":[{"number":3,"name":"高橋清太郎","prefecture":"岡山","period":"97","finish":"1","method":"差し","exception":"","riderClass":"A1"},{"number":2,"name":"山田哲也","prefecture":"愛知","period":"99","finish":"2","method":"差し","exception":"","riderClass":"A2"},{"number":7,"name":"阿部兼士","prefecture":"福岡","period":"93","finish":"3","method":"","exception":"","riderClass":"A1"},{"number":4,"name":"蒋野翔太","prefecture":"徳島","period":"115","finish":"4","method":"","exception":"","riderClass":"A1"},{"number":6,"name":"北川紋部","prefecture":"福井","period":"78","finish":"5","method":"","exception":"","riderClass":"A2"},{"number":5,"name":"三浦稔希","prefecture":"愛知","period":"76","finish":"6","method":"","exception":"","riderClass":"A1"},{"number":1,"name":"枝村弘樹","prefecture":"宮崎","period":"123","finish":"7","method":"","exception":"","riderClass":"A1"}],"9":[{"number":1,"name":"林昴","prefecture":"福岡","period":"119","finish":"1","method":"逃げ","exception":"","riderClass":"A1"},{"number":5,"name":"紫原政文","prefecture":"福岡","period":"61","finish":"2","method":"マーク","exception":"","riderClass":"A1"},{"number":3,"name":"大庭正紀","prefecture":"富山","period":"70","finish":"3","method":"","exception":"","riderClass":"A1"},{"number":2,"name":"宇根秀俊","prefecture":"愛媛","period":"80","finish":"4","method":"","exception":"","riderClass":"A2"},{"number":6,"name":"穴井利久","prefecture":"福岡","period":"65","finish":"5","method":"","exception":"","riderClass":"A2"},{"number":4,"name":"藤原亮太","prefecture":"岡山","period":"97","finish":"6","method":"","exception":"","riderClass":"A2"},{"number":7,"name":"牛田樹希斗","prefecture":"愛知","period":"119","finish":"7","method":"","exception":"","riderClass":"A2"}],"10":[{"number":7,"name":"和田誠寿","prefecture":"広島","period":"103","finish":"1","method":"差し","exception":"","riderClass":"A1"},{"number":3,"name":"諸隈健太郎","prefecture":"高知","period":"127","finish":"2","method":"逃げ","exception":"","riderClass":"A2"},{"number":4,"name":"内藤敦","prefecture":"岡山","period":"80","finish":"3","method":"","exception":"","riderClass":"A2"},{"number":1,"name":"辻力","prefecture":"石川","period":"71","finish":"4","method":"","exception":"","riderClass":"A2"},{"number":2,"name":"境啓亨","prefecture":"熊本","period":"111","finish":"5","method":"","exception":"","riderClass":"A2"},{"number":6,"name":"興呂木雄治","prefecture":"熊本","period":"96","finish":"6","method":"","exception":"","riderClass":"A2"},{"number":5,"name":"有馬雄二","prefecture":"奈良","period":"90","finish":"7","method":"","exception":"","riderClass":"A2"}],"11":[{"number":2,"name":"中村健志","prefecture":"熊本","period":"96","finish":"1","method":"差し","exception":"","riderClass":"A1"},{"number":5,"name":"半田誠","prefecture":"熊本","period":"123","finish":"2","method":"逃げ","exception":"","riderClass":"A1"},{"number":7,"name":"西浦仙哉","prefecture":"三重","period":"73","finish":"3","method":"","exception":"","riderClass":"A1"},{"number":4,"name":"常次勇人","prefecture":"大阪","period":"121","finish":"4","method":"","exception":"","riderClass":"A1"},{"number":1,"name":"吉田智哉","prefecture":"愛媛","period":"111","finish":"5","method":"","exception":"","riderClass":"A1"},{"number":6,"name":"橋本凌汰","prefecture":"岡山","period":"119","finish":"6","method":"","exception":"","riderClass":"A1"},{"number":3,"name":"高野信元","prefecture":"愛知","period":"125","finish":"7","method":"","exception":"","riderClass":"A1"}]}''')
          url='https://www.chariloto.com/keirin/results/83/2026-10-01/'
          try:
              html=src.fetch(url)
          except Exception as e:
              print('KURUME_BATCH_SOURCE_HOLD',type(e).__name__,str(e)[:150])
              raise SystemExit(1)
          for r in (5,6,7,8,9,10,11):
              key=f'2026-10-01|83|{r}'
              try:
                  grade='L1' if r in (5,6) else 'A1'
                  obs=src.parse_result(html,'2026-10-01','83','久留米',r,grade,7,url)
                  found={int(x['number']):x for x in obs['results']}
                  differences=[]
                  for base in expected[str(r)]:
                      actual=found.get(base['number'])
                      if not actual:
                          differences.append([base['number'],'missing']);continue
                      for field,normal in (
                          ('name',normalized_name),('prefecture',normalized_prefecture),
                          ('period',str),('finish',str),('method',canonical_method),
                          ('exception',str)):
                          if normal(actual.get(field,'') or '')!=normal(base[field]):
                              differences.append([base['number'],field])
                  print('KURUME_BATCH_COMPARE',key,'PASS' if not differences else 'HOLD',
                        'cars',len(found),'mismatchCount',len(differences),
                        'details',differences[:10])
              except Exception as exc:
                  print('KURUME_BATCH_HOLD',key,type(exc).__name__,str(exc)[:170])
          PY
